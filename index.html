<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>WebXR Right Controller Diagnostics</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script>
        AFRAME.register-component('controller-debug', {
            init: function () {
                this.debugText = document.querySelector('#debug-text');
            },
            tick: function () {
                let sceneEl = this.el.sceneEl;
                let xrSession = sceneEl.renderer ? sceneEl.renderer.xr.getSession() : null;

                let output = "=== DIAGNOSTICA CONTROLLER DESTRO ===\n\n";
                output += "Sessione XR: " + (xrSession ? "ATTIVA (Immersive)" : "DISATTIVA (Desktop)") + "\n";

                let rightFound = false;

                // 1. Controllo tramite inputSources WebXR
                if (xrSession && xrSession.inputSources) {
                    for (let source of xrSession.inputSources) {
                        // Cerchiamo esplicitamente la mano destra
                        if (source.handedness === 'right' && source.gamepad) {
                            rightFound = true;
                            let gp = source.gamepad;
                            let trig = gp.buttons[0] ? gp.buttons[0].value.toFixed(2) : "N/D";
                            let stickX = gp.axes.length > 2 ? gp.axes[2].toFixed(2) : (gp.axes.length > 0 ? gp.axes[0].toFixed(2) : "N/D");
                            let stickY = gp.axes.length > 3 ? gp.axes[3].toFixed(2) : (gp.axes.length > 1 ? gp.axes[1].toFixed(2) : "N/D");

                            output += "[WebXR Source Trovata!]\n";
                            output += "ID: " + (gp.id || "Sconosciuto") + "\n";
                            output += "Grilletto (Trigger): " + trig + "\n";
                            output += "Stick X: " + stickX + " | Stick Y: " + stickY + "\n";
                            break;
                        }
                    }
                }

                // 2. Fallback su Gamepad API standard se XR non ha ancora mappato le mani
                if (!rightFound) {
                    let gamepads = navigator.getGamepads ? navigator.getGamepads() : [];
                    for (let i = 0; i < gamepads.length; i++) {
                        let gp = gamepads[i];
                        if (gp && gp.connected) {
                            let idStr = (gp.id || "").toLowerCase();
                            // Filtriamo o cerchiamo indizi del controller destro / Oculus / Meta
                            if (idStr.includes('right') || idStr.includes('oculus') || idStr.includes('meta') || i === 0) {
                                let trig = gp.buttons[0] ? gp.buttons[0].value.toFixed(2) : "N/D";
                                let stickX = gp.axes.length > 2 ? gp.axes[2].toFixed(2) : (gp.axes.length > 0 ? gp.axes[0].toFixed(2) : "N/D");

                                output += "[Gamepad API Fallback]\n";
                                output += "Index [" + i + "] ID: " + gp.id.substring(0, 20) + "\n";
                                output += "Grilletto: " + trig + " | StickX: " + stickX + "\n";
                                rightFound = true;
                                break;
                            }
                        }
                    }
                }

                if (!rightFound) {
                    output += "\nNessun controller destro rilevato.\nAssicurati di premere il tasto 'VR'\nin basso a destra e di indossare il visore.";
                }

                if (this.debugText) {
                    this.debugText.setAttribute('value', output);
                }
            }
        });
    </script>
</head>
<body>
    <a-scene xr-mode-ui="enabled: true" controller-debug>
        <a-light type="ambient" color="#FFF" intensity="1"></a-light>

        <!-- Sfondo grigio neutro per orientarsi -->
        <a-plane position="0 0 -5" width="20" height="20" color="#222"></a-plane>

        <!-- Pannello HUD fluttuante gigante davanti agli occhi -->
        <a-entity position="0 1.6 -1.8">
            <a-plane width="2.4" height="1.4" color="#000000" opacity="0.9" material="shader: flat"></a-plane>
            <a-text id="debug-text" value="In attesa di connessione WebXR..." position="0 0 0.01" align="center" color="#00FF66" width="3.2" font="monoid"></a-text>
        </a-entity>

        <a-camera></a-camera>
    </a-scene>
</body>
</html>
