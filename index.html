<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>WebXR Poll-Based Right Controller Diagnostics</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script>
        // Componente basato su polling attivo delle inputSources WebXR (standard xr-standard)
        AFRAME.register-component('xr-poll-diagnostics', {
            init: function () {
                this.debugText = document.querySelector('#debug-text');
            },
            tick: function () {
                let sceneEl = this.el.sceneEl;
                let xrSession = sceneEl.renderer ? sceneEl.renderer.xr.getSession() : null;

                let output = "=== POLLING WEBXR (xr-standard) ===\n\n";
                
                if (!xrSession) {
                    output += "Sessione XR: IN ATTESA...\n\n";
                    output += "Indossa il visore e premi il tasto\n'VR' in basso a destra per avviare.";
                    if (this.debugText) this.debugText.setAttribute('value', output);
                    return;
                }

                output += "Sessione XR: ATTIVA\n";
                let rightFound = false;

                // Polling attivo su tutte le sorgenti di input XR collegate
                if (xrSession.inputSources) {
                    for (let source of xrSession.inputSources) {
                        // Verifichiamo che sia la mano destra e che disponga di un gamepad mappato
                        if (source.handedness === 'right' && source.gamepad) {
                            rightFound = true;
                            let gp = source.gamepad;

                            // Lettura standard xr-standard dei pulsanti e degli assi
                            let triggerVal = (gp.buttons && gp.buttons[0]) ? gp.buttons[0].value.toFixed(2) : "0.00";
                            let triggerPressed = (gp.buttons && gp.buttons[0]) ? gp.buttons[0].pressed : false;
                            
                            let stickX = (gp.axes && gp.axes.length > 2) ? gp.axes[2].toFixed(2) : ((gp.axes && gp.axes.length > 0) ? gp.axes[0].toFixed(2) : "0.00");
                            let stickY = (gp.axes && gp.axes.length > 3) ? gp.axes[3].toFixed(2) : ((gp.axes && gp.axes.length > 1) ? gp.axes[1].toFixed(2) : "0.00");

                            output += "Profilo: " + (gp.mapping || "sconosciuto") + "\n";
                            output += "ID: " + (gp.id ? gp.id.substring(0, 18) : "N/D") + "\n";
                            output += "----------------------------------\n";
                            output += "Grilletto (Value): " + triggerVal + (triggerPressed ? " [PREMUTO]" : "") + "\n";
                            output += "Thumbstick X: " + stickX + "\n";
                            output += "Thumbstick Y: " + stickY + "\n";
                            break;
                        }
                    }
                }

                if (!rightFound) {
                    output += "\nController destro non rilevato.\nVerifica che sia acceso e associato.";
                }

                if (this.debugText) {
                    this.debugText.setAttribute('value', output);
                }
            }
        });
    </script>
</head>
<body>
    <a-scene xr-mode-ui="enabled: true" xr-poll-diagnostics>
        <a-light type="ambient" color="#FFF" intensity="1"></a-light>

        <!-- Sfondo scuro per contrasto -->
        <a-plane position="0 0 -5" width="20" height="20" color="#111"></a-plane>

        <!-- Pannello HUD fluttuante davanti agli occhi -->
        <a-entity position="0 1.6 -1.8">
            <a-plane width="2.6" height="1.4" color="#000000" opacity="0.9" material="shader: flat"></a-plane>
            <a-text id="debug-text" value="Avvio polling WebXR..." position="0 0 0.01" align="center" color="#00FF66" width="3.2" font="monoid"></a-text>
        </a-entity>

        <a-camera></a-camera>
    </a-scene>
</body>
</html>
