<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <title>VertiVR Simulator - Sfida 1</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script>
        // COMPONENTE PER LA TELECAMERA SECONDARIA
        AFRAME.registerComponent('pip-camera', {
            schema: { monitor: {type: 'selector'} },
            init: function () {
                this.camera = new THREE.PerspectiveCamera(60, 1, 0.05, 100);
                this.el.object3D.add(this.camera);
                this.renderTarget = new THREE.WebGLRenderTarget(256, 256, {
                    minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter, format: THREE.RGBAFormat
                });
                this.materialAssigned = false;
                this.targetPos = new THREE.Vector3();
                
                this.isTransitioning = false;
                this.el.sceneEl.addEventListener('enter-vr', () => {
                    this.isTransitioning = true;
                    setTimeout(() => { this.isTransitioning = false; }, 1000);
                });
                this.el.sceneEl.addEventListener('exit-vr', () => {
                    this.isTransitioning = true;
                    setTimeout(() => { this.isTransitioning = false; }, 1000);
                });
            },
            tick: function () {
                if (this.isTransitioning) return;
                const renderer = this.el.sceneEl.renderer;
                const scene = this.el.sceneEl.object3D;
                if (!renderer || !scene) return;
                if (this.el.sceneEl.is('vr-mode') && (!renderer.xr || !renderer.xr.isPresenting)) return;

                const targetEl = document.querySelector('#hook-magnet');
                if (targetEl && targetEl.object3D) {
                    targetEl.object3D.getWorldPosition(this.targetPos);
                    this.camera.lookAt(this.targetPos);
                }

                if (!this.materialAssigned && this.data.monitor) {
                    const mesh = this.data.monitor.getObject3D('mesh');
                    if (mesh && mesh.material) {
                        mesh.material = new THREE.MeshBasicMaterial({ map: this.renderTarget.texture, side: THREE.FrontSide });
                        this.materialAssigned = true;
                    }
                }
                
                const currentXrEnabled = renderer.xr.enabled;
                const currentRenderTarget = renderer.getRenderTarget();
                if (currentXrEnabled) renderer.xr.enabled = false;
                
                renderer.setRenderTarget(this.renderTarget);
                renderer.clear();
                renderer.render(scene, this.camera);
                
                renderer.setRenderTarget(currentRenderTarget);
                if (currentXrEnabled) renderer.xr.enabled = true;
            }
        });

        // LOGICA DI VOLO E GIOCO (V 18.0.0 - HUD COMPLETO + LIVELLO)
        AFRAME.registerComponent('vertibird-flight', {
            init: function () {
                this.version = "18.0.0"; 
                this.angle = 0;        
                this.heliY = 0.75;     
                this.radius = 6.48;    
                
                this.currentThrottle = 0;
                this.currentStickY = 0;
                this.angularVelocity = 0; 
                this.speedMultiplier = 180.0; 
                this.wobbleAmplitude = 30; 
                this.inertiaValue = 80;     
                this.rotorAngle = 0;
                this.currentAngularSpeed = 0; 
                this.hookDifficulty = 1; 
                this.gameLevel = 1; // Nuova variabile Livello
                this.camOrbitalAngle = 90; 

                this.dragP = new THREE.Vector3();
                this.dragQ = new THREE.Quaternion();
                this.dragS = new THREE.Vector3();
                this.dragEuler = new THREE.Euler();
                this.targetWorldPos = new THREE.Vector3();
                this.camWorldPos = new THREE.Vector3();
                this.hookL = new THREE.Vector3();
                this.objL = new THREE.Vector3();
                this.platL = new THREE.Vector3();
                this.heliL = new THREE.Vector3();

                this.worldRoot = document.querySelector('#world-root');
                this.cameraEl = document.querySelector('a-camera');
                this.heliWrapperEl = document.querySelector('#heli-wrapper');
                
                this.currentScale = 0.06; 
                this.isDragging = false;
                this.isZoomed = false; 
                this.prevScale = this.currentScale;
                this.prevPos = new THREE.Vector3();
                this.prevQuat = new THREE.Quaternion();

                this.initialControllerMatrixInv = new THREE.Matrix4();
                this.initialWorldMatrix = new THREE.Matrix4();
                
                this.heliPitchEl = document.querySelector('#heli-pitch');
                this.rotorEl = document.querySelector('#main-rotor');
                this.rightHandEl = document.querySelector('#right-hand');
                this.leftHandEl = document.querySelector('#left-hand');

                this.hookArea = document.querySelector('#hook-area');
                this.hookMagnet = document.querySelector('#hook-magnet');
                this.pipCamRig = document.querySelector('#pip-cam-rig');
                
                this.attachedCrate = null;
                this.prevRightTrigger = false;

                // Definizione Piazzole
                this.platforms = [
                    { el: document.querySelector('#drop-zone'), height: 0.5, radius: 0.75, color: 'blue', pos: {x: 6.48, z: 0} },  
                    { el: document.querySelector('#plat-high'), height: 0.8, radius: 0.75, color: 'purple', pos: {x: 0, z: 6.48} },   
                    { el: document.querySelector('#plat-left'), height: 0.3, radius: 0.75, color: 'orange', pos: {x: -6.48, z: 0} },   
                    { el: document.querySelector('#plat-low'), height: 0.3, radius: 0.75, color: 'green', pos: {x: 0, z: -6.48} }     
                ];

                // SETUP SFIDA 1: Posiziona 3 casse su 3 piazzole senza far coincidere i colori
                let allCrates = Array.from(document.querySelectorAll('.cargo-crate'));
                let shuffledPads = [...this.platforms].sort(() => 0.5 - Math.random());
                let selectedPads = shuffledPads.slice(0, 3);
                
                let validSetup = false;
                let selectedCrates = [];
                
                while(!validSetup) {
                    let tempCrates = [...allCrates].sort(() => 0.5 - Math.random());
                    selectedCrates = tempCrates.slice(0, 3);
                    validSetup = true;
                    for(let i=0; i<3; i++) {
                        if(selectedCrates[i].dataset.color === selectedPads[i].color) {
                            validSetup = false;
                            break;
                        }
                    }
                }

                for(let i=0; i<3; i++) {
                    let crate = selectedCrates[i];
                    let pad = selectedPads[i];
                    crate.object3D.position.set(pad.pos.x, pad.height + 0.2, pad.pos.z);
                    crate.setAttribute('visible', 'true');
                }
                
                // Nascondi la quarta cassa inutilizzata
                let unusedCrate = allCrates.find(c => !selectedCrates.includes(c));
                if(unusedCrate) {
                    unusedCrate.setAttribute('visible', 'false');
                    unusedCrate.object3D.position.set(0, -10, 0);
                }

                if (this.worldRoot && this.worldRoot.object3D) {
                    this.worldRoot.object3D.scale.set(this.currentScale, this.currentScale, this.currentScale);
                }
                if (this.pipCamRig) {
                    let rad = this.camOrbitalAngle * Math.PI / 180;
                    this.pipCamRig.object3D.position.set(Math.cos(rad) * 1.5, -0.27, Math.sin(rad) * 1.5);
                }

                // RIPRISTINO HUD COMPLETO
                this.speedText = document.querySelector('#menu-speed-val');
                this.windText = document.querySelector('#menu-wind-val');
                this.inertiaText = document.querySelector('#menu-inertia-val');
                this.diffText = document.querySelector('#menu-diff-val');
                this.levelText = document.querySelector('#menu-level-val');
                this.versionText = document.querySelector('#menu-version-val');

                this.updateMenuUI = () => {
                    if (this.speedText) this.speedText.setAttribute('value', `${this.speedMultiplier.toFixed(0)} deg/s`);
                    if (this.windText) this.windText.setAttribute('value', `${this.wobbleAmplitude.toFixed(0)}`);
                    if (this.inertiaText) this.inertiaText.setAttribute('value', `${this.inertiaValue.toFixed(0)}`);
                    if (this.diffText) this.diffText.setAttribute('value', `Lv ${this.hookDifficulty}`);
                    if (this.levelText) this.levelText.setAttribute('value', `Lv ${this.gameLevel}`);
                    if (this.versionText) this.versionText.setAttribute('value', `v${this.version}`);
                };
                
                let btnSpeedDec = document.querySelector('#btn-speed-dec');
                let btnSpeedInc = document.querySelector('#btn-speed-inc');
                let btnWindDec = document.querySelector('#btn-wind-dec');
                let btnWindInc = document.querySelector('#btn-wind-inc');
                let btnInertiaDec = document.querySelector('#btn-inertia-dec');
                let btnInertiaInc = document.querySelector('#btn-inertia-inc');
                let btnDiffDec = document.querySelector('#btn-diff-dec');
                let btnDiffInc = document.querySelector('#btn-diff-inc');
                let btnLevelDec = document.querySelector('#btn-level-dec');
                let btnLevelInc = document.querySelector('#btn-level-inc');

                if (btnSpeedDec) btnSpeedDec.addEventListener('click', () => { this.speedMultiplier = Math.max(10.0, this.speedMultiplier - 15.0); this.updateMenuUI(); });
                if (btnSpeedInc) btnSpeedInc.addEventListener('click', () => { this.speedMultiplier = Math.min(300.0, this.speedMultiplier + 15.0); this.updateMenuUI(); });
                if (btnWindDec) btnWindDec.addEventListener('click', () => { this.wobbleAmplitude = Math.max(0, this.wobbleAmplitude - 10); this.updateMenuUI(); });
                if (btnWindInc) btnWindInc.addEventListener('click', () => { this.wobbleAmplitude = Math.min(150, this.wobbleAmplitude + 10); this.updateMenuUI(); });
                if (btnInertiaDec) btnInertiaDec.addEventListener('click', () => { this.inertiaValue = Math.max(0, this.inertiaValue - 10); this.updateMenuUI(); });
                if (btnInertiaInc) btnInertiaInc.addEventListener('click', () => { this.inertiaValue = Math.min(100, this.inertiaValue + 10); this.updateMenuUI(); });
                if (btnDiffDec) btnDiffDec.addEventListener('click', () => { this.hookDifficulty = Math.max(1, this.hookDifficulty - 1); this.updateMenuUI(); });
                if (btnDiffInc) btnDiffInc.addEventListener('click', () => { this.hookDifficulty = Math.min(5, this.hookDifficulty + 1); this.updateMenuUI(); });
                if (btnLevelDec) btnLevelDec.addEventListener('click', () => { this.gameLevel = Math.max(1, this.gameLevel - 1); this.updateMenuUI(); });
                if (btnLevelInc) btnLevelInc.addEventListener('click', () => { this.gameLevel = Math.min(10, this.gameLevel + 1); this.updateMenuUI(); });

                this.updateMenuUI();
            },

            tick: function (time, delta) {
                let dt = delta / 1000;
                let t = time / 1000; 
                
                let leftTrigger = 0, rightGrip = 0, rightStickY = 0, rightTrigger = 0, leftStickX = 0;
                let xrSession = this.el.sceneEl.renderer?.xr?.getSession(); 
                
                if (xrSession && xrSession.inputSources) {
                    for (let source of xrSession.inputSources) {
                        if (source.handedness === 'left' && source.gamepad) {
                            let gp = source.gamepad;
                            leftTrigger = gp.buttons[0] ? gp.buttons[0].value : 0;
                            leftStickX = gp.axes.length >= 2 ? gp.axes[0] : 0;
                        }
                        if (source.handedness === 'right' && source.gamepad) {
                            let gp = source.gamepad;
                            rightTrigger = gp.buttons[0] ? gp.buttons[0].value : 0; 
                            rightGrip = gp.buttons[1] ? (gp.buttons[1].value || (gp.buttons[1].pressed ? 1 : 0)) : 0;
                            rightStickY = gp.axes.length >= 4 ? gp.axes[3] : (gp.axes.length >= 2 ? gp.axes[1] : 0);
                        }
                    }
                }

                if (Math.abs(rightStickY) < 0.15) rightStickY = 0;
                if (Math.abs(leftStickX) < 0.15) leftStickX = 0;
                if (leftTrigger < 0.02) leftTrigger = 0;

                if (Math.abs(leftStickX) > 0.15) {
                    this.camOrbitalAngle += leftStickX * 120.0 * dt; 
                    if (this.pipCamRig) {
                        let rad = this.camOrbitalAngle * Math.PI / 180;
                        this.pipCamRig.object3D.position.set(Math.cos(rad) * 1.5, -0.27, Math.sin(rad) * 1.5);
                    }
                }

                this.currentThrottle += (leftTrigger - this.currentThrottle) * dt * 5.0;
                this.currentStickY += (rightStickY - this.currentStickY) * dt * 6.0;

                let activeMinY = 0.25; 
                if (this.heliWrapperEl) {
                    this.heliWrapperEl.object3D.getWorldPosition(this.heliL);
                    this.worldRoot.object3D.worldToLocal(this.heliL);
                    for (let plat of this.platforms) {
                        let distHoriz = Math.hypot(this.heliL.x - plat.pos.x, this.heliL.z - plat.pos.z);
                        if (distHoriz < plat.radius) {
                            let surfaceY = plat.height + 0.25; 
                            if (this.heliY >= (surfaceY - 0.15)) activeMinY = Math.max(activeMinY, surfaceY);
                        }
                    }
                }

                // FISICA ELICOTTERO
                let isAirborne = this.heliY > (activeMinY + 0.008);
                let wobbleThrottleOffset = 0;
                let wobbleStickOffset = 0;

                if (this.wobbleAmplitude > 0 && isAirborne) {
                    let normWobble = this.wobbleAmplitude / 100.0;
                    wobbleThrottleOffset = ((Math.sin(t * 2.3) * 0.05) + (Math.cos(t * 4.7) * 0.025)) * normWobble;
                    wobbleStickOffset = ((Math.sin(t * 1.9) * 0.08) + (Math.cos(t * 3.8) * 0.04)) * normWobble;
                }

                let effectiveThrottleInput = Math.max(0, Math.min(1.0, this.currentThrottle + wobbleThrottleOffset));
                let effectiveStickYInput = Math.max(-1.0, Math.min(1.0, this.currentStickY + wobbleStickOffset));

                let takeoffThreshold = 0.35; 
                let effectiveThrottle = effectiveThrottleInput > takeoffThreshold ? (effectiveThrottleInput - takeoffThreshold) / (1.0 - takeoffThreshold) : 0;
                let maxFlightHeight = 2.42;
                
                let targetHeliY = activeMinY + (effectiveThrottle * (maxFlightHeight - (activeMinY - 0.25)));
                this.heliY += (targetHeliY - this.heliY) * dt * 6.0;
                if (this.heliY < activeMinY) this.heliY = activeMinY;

                let hingeAngleRad = Math.asin((this.heliY - 0.85) / this.radius);
                let hingeAngleDeg = hingeAngleRad * (180 / Math.PI);
                let speedFactor = effectiveStickYInput; 
                
                if (this.heliWrapperEl) this.heliWrapperEl.setAttribute('rotation', { x: 0, y: 0, z: -hingeAngleDeg });
                if (this.heliPitchEl) this.heliPitchEl.setAttribute('rotation', { x: 0, y: 0, z: speedFactor * 15.0 });

                if (isAirborne) {
                    let targetSpeed = -speedFactor * effectiveThrottleInput * this.speedMultiplier;
                    let inertiaFactor = this.inertiaValue / 100.0;
                    let accelRate = 0.5 + ((1.0 - inertiaFactor) * 12.0); 
                    let friction = 0.3 + ((1.0 - inertiaFactor) * 8.0);   
                    this.angularVelocity += (targetSpeed - this.angularVelocity) * accelRate * dt;
                    if (Math.abs(targetSpeed) < 0.05) this.angularVelocity -= this.angularVelocity * friction * dt;
                } else {
                    let groundFriction = 2.5 + ((1.0 - (this.inertiaValue / 100.0)) * 8.0); 
                    this.angularVelocity -= this.angularVelocity * groundFriction * dt;
                    if (Math.abs(this.angularVelocity) < 0.2) this.angularVelocity = 0;
                }

                this.angle += this.angularVelocity * dt;
                this.el.setAttribute('rotation', { x: 0, y: this.angle, z: hingeAngleDeg });

                if (this.currentThrottle > 0.01 && this.rotorEl) {
                    this.rotorAngle += (effectiveThrottleInput * 4000) * dt;
                    this.rotorEl.setAttribute('rotation', `0 ${this.rotorAngle % 360} 0`);
                }

                // GESTIONE CALAMITE MULTIPLE, AGGANCIO E SGANCIO VINCOLATO
                if (this.hookMagnet && this.hookArea) {
                    this.hookMagnet.object3D.getWorldPosition(this.hookL);
                    this.worldRoot.object3D.worldToLocal(this.hookL);

                    let allCrates = Array.from(document.querySelectorAll('.cargo-crate'));
                    let closestCrate = null;
                    let minDist = Infinity;

                    if (!this.attachedCrate) {
                        for(let crate of allCrates) {
                            if (crate.getAttribute('visible') === false) continue;
                            let objMagnet = crate.querySelector('.object-magnet');
                            objMagnet.object3D.getWorldPosition(this.objL);
                            this.worldRoot.object3D.worldToLocal(this.objL);
                            let dist = this.hookL.distanceTo(this.objL);
                            if (dist < minDist) {
                                minDist = dist;
                                closestCrate = crate;
                            }
                        }
                    } else {
                        closestCrate = this.attachedCrate;
                    }

                    let activeObjMagnet = closestCrate ? closestCrate.querySelector('.object-magnet') : null;
                    
                    const tolerances = [0.03, 0.02, 0.015, 0.01, 0.005];
                    let canGrab = !this.attachedCrate && closestCrate && (minDist < tolerances[this.hookDifficulty - 1]);

                    let canDrop = false;
                    let targetDropHeight = 0;
                    
                    for (let plat of this.platforms) {
                        let distH = Math.hypot(this.hookL.x - plat.pos.x, this.hookL.z - plat.pos.z);
                        if (distH < plat.radius) {
                            if (this.hookL.y >= plat.height && this.hookL.y <= (plat.height + 0.8)) {
                                canDrop = true;
                                targetDropHeight = plat.height;
                                break;
                            }
                        }
                    }

                    allCrates.forEach(c => c.querySelector('.object-magnet').setAttribute('color', '#4CAF50'));

                    if (this.attachedCrate) {
                        if (canDrop) {
                            this.hookMagnet.setAttribute('color', '#FFFF00'); // GIALLO: Sgancio Autorizzato
                            activeObjMagnet.setAttribute('color', '#FFFF00');
                        } else {
                            this.hookMagnet.setAttribute('color', '#4CAF50'); // Verde: in volo
                            activeObjMagnet.setAttribute('color', '#4CAF50');
                        }
                    } else if (canGrab) {
                        this.hookMagnet.setAttribute('color', '#FF0000'); // ROSSO: Pronto all'aggancio
                        activeObjMagnet.setAttribute('color', '#FF0000');
                    } else {
                        this.hookMagnet.setAttribute('color', '#4CAF50'); // Verde
                    }

                    let triggerPressed = rightTrigger > 0.5;
                    if (triggerPressed && !this.prevRightTrigger) {
                        if (this.attachedCrate) {
                            if (canDrop) { 
                                this.worldRoot.object3D.add(this.attachedCrate.object3D);
                                this.attachedCrate.object3D.position.set(this.hookL.x, targetDropHeight + 0.2, this.hookL.z); 
                                this.attachedCrate.object3D.rotation.set(0, 0, 0);
                                this.attachedCrate = null;
                            }
                        } else if (canGrab) { 
                            this.attachedCrate = closestCrate;
                            this.hookArea.object3D.add(this.attachedCrate.object3D);
                            this.attachedCrate.object3D.position.set(0, -0.762, 0); 
                            this.attachedCrate.object3D.rotation.set(0, 0, 0);
                        }
                    }
                    this.prevRightTrigger = triggerPressed;

                    allCrates.forEach(crate => {
                        if (crate === this.attachedCrate || crate.getAttribute('visible') === false) return;
                        
                        let targetFloorY = 0;
                        let cx = crate.object3D.position.x;
                        let cz = crate.object3D.position.z;
                        
                        for (let plat of this.platforms) {
                            if (Math.hypot(cx - plat.pos.x, cz - plat.pos.z) < plat.radius) {
                                targetFloorY = plat.height;
                                break;
                            }
                        }

                        let crateRestY = targetFloorY + 0.2; 
                        if (crate.object3D.position.y > crateRestY) {
                            crate.object3D.position.y -= dt * 3.0; 
                            if (crate.object3D.position.y <= crateRestY) {
                                crate.object3D.position.y = crateRestY;
                                crate.object3D.rotation.set(0,0,0);
                            }
                        }
                    });
                }
            }
        });
    </script>
    <style>
        #xr-button-container { position: fixed; bottom: 20px; right: 20px; z-index: 9999; display: flex; gap: 12px; }
        .custom-xr-btn { background-color: #2e7d32; color: white; border: 2px solid #4caf50; padding: 12px 24px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; }
    </style>
</head>
<body>
    <div id="xr-button-container">
        <button class="custom-xr-btn" onclick="document.querySelector('a-scene').enterAR()">AR</button>
        <button class="custom-xr-btn" onclick="document.querySelector('a-scene').enterVR()">VR</button>
    </div>

    <a-scene xr-mode-ui="enabled: false">
        <a-assets>
            <img id="terrain-img" src="terreno.jpg" crossorigin="anonymous">
            <img id="menu-bg" src="VertiVRMenu.jpg" crossorigin="anonymous">
            <img id="frontalino-img" src="frontalino.jpg" crossorigin="anonymous">
            <img id="sfondo-img" src="sfondo.png" crossorigin="anonymous">
            <img id="cassa-img" src="cassa.jpg" crossorigin="anonymous">
            <a-asset-item id="verti-model" src="VertilowRed.glb"></a-asset-item>
        </a-assets>

        <a-light type="ambient" color="#FFF" intensity="1.2"></a-light>
        <a-light type="directional" color="#FFF" intensity="1.0" position="-1 3 1"></a-light>

        <a-entity id="world-root" position="0 0.8 -0.8" rotation="0 0 0" scale="0.06 0.06 0.06">
            <a-cylinder position="0 -0.05 0" radius="8.4" height="0.1" material="src: #terrain-img; opacity: 0.3"></a-cylinder>
            <a-cylinder position="0 2.5 0" radius="8.4" height="5" open-ended="true" theta-start="-108" theta-length="216" rotation="0 180 0" material="src: #sfondo-img; side: double; transparent: true; opacity: 0.9; shader: flat"></a-cylinder>

            <!-- STRUTTURA CENTRALE -->
            <a-box position="0 0.3 0" width="1.8" height="0.6" depth="1.8" color="#FFFFFF"></a-box>
            <a-plane position="0 0.3 0.901" width="1.8" height="0.6" material="src: #frontalino-img; shader: flat"></a-plane>
            <a-sphere position="0 0.6 0" radius="0.675" color="#FFCC00"></a-sphere>

            <!-- PIAZZOLE DI ATTERRAGGIO (Con la "H") -->
            <a-entity id="drop-zone" position="6.48 0 0">
                <a-cylinder position="0 0.25 0" radius="0.75" height="0.5" color="#1976D2"></a-cylinder>
                <a-ring position="0 0.501 0" rotation="-90 0 0" radius-inner="0.6" radius-outer="0.72" color="#FFEB3B"></a-ring>
                <a-text value="H" position="0 0.501 0" rotation="-90 0 0" align="center" width="5" color="#FFF" font="mozillavr"></a-text>
            </a-entity>

            <a-entity id="plat-high" position="0 0 6.48">
                <a-cylinder position="0 0.40 0" radius="0.75" height="0.8" color="#9C27B0"></a-cylinder>
                <a-ring position="0 0.801 0" rotation="-90 0 0" radius-inner="0.6" radius-outer="0.72" color="#FFFFFF"></a-ring>
                <a-text value="H" position="0 0.801 0" rotation="-90 0 0" align="center" width="5" color="#FFF" font="mozillavr"></a-text>
            </a-entity>

            <a-entity id="plat-left" position="-6.48 0 0">
                <a-cylinder position="0 0.15 0" radius="0.75" height="0.3" color="#FF9800"></a-cylinder>
                <a-ring position="0 0.301 0" rotation="-90 0 0" radius-inner="0.6" radius-outer="0.72" color="#FFFFFF"></a-ring>
                <a-text value="H" position="0 0.301 0" rotation="-90 0 0" align="center" width="5" color="#FFF" font="mozillavr"></a-text>
            </a-entity>

            <a-entity id="plat-low" position="0 0 -6.48">
                <a-cylinder position="0 0.15 0" radius="0.75" height="0.3" color="#4CAF50"></a-cylinder>
                <a-ring position="0 0.301 0" rotation="-90 0 0" radius-inner="0.6" radius-outer="0.72" color="#FFFFFF"></a-ring>
                <a-text value="H" position="0 0.301 0" rotation="-90 0 0" align="center" width="5" color="#FFF" font="mozillavr"></a-text>
            </a-entity>

            <!-- LE 4 CASSE (Calamite incrementate del 15% -> radius="0.046") -->
            <a-entity id="crates-container">
                <a-entity class="cargo-crate" data-color="blue" position="0 -10 0">
                    <a-box position="0 0.2 0" width="0.4" height="0.4" depth="0.4" material="src: #cassa-img"></a-box>
                    <a-plane position="0 0.401 0" rotation="-90 0 0" width="0.4" height="0.4" color="#1976D2" material="shader: flat"></a-plane>
                    <a-cylinder position="0 0.45 0" radius="0.01" height="0.1" color="#333"></a-cylinder>
                    <a-sphere class="object-magnet" position="0 0.52 0" radius="0.046" color="#4CAF50" material="emissive: #4CAF50"></a-sphere>
                </a-entity>
                <a-entity class="cargo-crate" data-color="purple" position="0 -10 0">
                    <a-box position="0 0.2 0" width="0.4" height="0.4" depth="0.4" material="src: #cassa-img"></a-box>
                    <a-plane position="0 0.401 0" rotation="-90 0 0" width="0.4" height="0.4" color="#9C27B0" material="shader: flat"></a-plane>
                    <a-cylinder position="0 0.45 0" radius="0.01" height="0.1" color="#333"></a-cylinder>
                    <a-sphere class="object-magnet" position="0 0.52 0" radius="0.046" color="#4CAF50" material="emissive: #4CAF50"></a-sphere>
                </a-entity>
                <a-entity class="cargo-crate" data-color="orange" position="0 -10 0">
                    <a-box position="0 0.2 0" width="0.4" height="0.4" depth="0.4" material="src: #cassa-img"></a-box>
                    <a-plane position="0 0.401 0" rotation="-90 0 0" width="0.4" height="0.4" color="#FF9800" material="shader: flat"></a-plane>
                    <a-cylinder position="0 0.45 0" radius="0.01" height="0.1" color="#333"></a-cylinder>
                    <a-sphere class="object-magnet" position="0 0.52 0" radius="0.046" color="#4CAF50" material="emissive: #4CAF50"></a-sphere>
                </a-entity>
                <a-entity class="cargo-crate" data-color="green" position="0 -10 0">
                    <a-box position="0 0.2 0" width="0.4" height="0.4" depth="0.4" material="src: #cassa-img"></a-box>
                    <a-plane position="0 0.401 0" rotation="-90 0 0" width="0.4" height="0.4" color="#4CAF50" material="shader: flat"></a-plane>
                    <a-cylinder position="0 0.45 0" radius="0.01" height="0.1" color="#333"></a-cylinder>
                    <a-sphere class="object-magnet" position="0 0.52 0" radius="0.046" color="#4CAF50" material="emissive: #4CAF50"></a-sphere>
                </a-entity>
            </a-entity>

            <!-- VERTIBIRD -->
            <a-entity id="vertibird" position="0 0.85 0" vertibird-flight>
                <a-box id="rod" position="3.24 0 0" width="6.48" height="0.02" depth="0.02" color="#808080"></a-box>
                <a-entity id="heli-wrapper" position="6.48 0 0">
                    <a-entity id="heli-yaw" rotation="0 90 0">
                        <a-entity id="heli-pitch" rotation="0 0 0">
                            
                            <!-- Elicottero Model -->
                            <a-gltf-model src="#verti-model" position="-0.10 0.2 0" scale="2.415 2.415 2.415" rotation="0 180 0"></a-gltf-model>
                            <a-entity position="-0.10 0.48 0">
                                <a-cylinder position="0 0.08 0" radius="0.035" height="0.15" material="color: #333"></a-cylinder>
                                <a-sphere position="0 0.16 0" radius="0.07" material="color: #FFCC00"></a-sphere>
                                <a-box id="main-rotor" position="0 0.19 0" width="2.8" height="0.012" depth="0.1" color="#FFEB3B"></a-box>
                            </a-entity>

                            <!-- GANCIO (Calamita incrementata del 15% -> radius="0.046") -->
                            <a-entity id="hook-area" position="0 0 0">
                                <a-cylinder position="0 -0.121 0" radius="0.003" height="0.242" color="#222"></a-cylinder>
                                <a-sphere id="hook-magnet" position="0 -0.242 0" radius="0.046" color="#4CAF50" material="emissive: #4CAF50"></a-sphere>
                                <a-entity id="pip-cam-rig">
                                    <a-entity pip-camera="monitor: #hook-monitor"></a-entity>
                                </a-entity>
                            </a-entity>
                        </a-entity>
                    </a-entity>
                </a-entity>
            </a-entity>

            <!-- CONSOLLE SCHERMI RIALZATA AL CENTRO -->
            <a-entity id="central-dashboard" position="0 7.5 -2.0" rotation="20 0 0">
                <a-entity id="menu-panel" position="-2.2 0 0" visible="true">
                    <a-plane width="3.6" height="6.4" material="shader: flat; src: #menu-bg"></a-plane>
                    
                    <!-- RIPRISTINO HUD COMPLETO -->
                    <a-text value="Speed" position="-1.5 0.1 0.05" align="left" width="5.5" color="#000000"></a-text>
                    <a-plane id="btn-speed-dec" class="clickable" position="-0.05 0.1 0.05" width="0.4" height="0.4" color="#D32F2F"><a-text value="-" align="center" width="8" color="#FFF"></a-text></a-plane>
                    <a-text id="menu-speed-val" value="180 deg/s" position="0.6 0.1 0.05" align="center" width="4.5" color="#000000"></a-text>
                    <a-plane id="btn-speed-inc" class="clickable" position="1.35 0.1 0.05" width="0.4" height="0.4" color="#388E3C"><a-text value="+" align="center" width="8" color="#FFF"></a-text></a-plane>

                    <a-text value="Wobbling" position="-1.5 -0.6 0.05" align="left" width="5.5" color="#000000"></a-text>
                    <a-plane id="btn-wind-dec" class="clickable" position="-0.05 -0.6 0.05" width="0.4" height="0.4" color="#D32F2F"><a-text value="-" align="center" width="8" color="#FFF"></a-text></a-plane>
                    <a-text id="menu-wind-val" value="30" position="0.6 -0.6 0.05" align="center" width="4.5" color="#000000"></a-text>
                    <a-plane id="btn-wind-inc" class="clickable" position="1.35 -0.6 0.05" width="0.4" height="0.4" color="#388E3C"><a-text value="+" align="center" width="8" color="#FFF"></a-text></a-plane>

                    <a-text value="Inertia" position="-1.5 -1.3 0.05" align="left" width="5.5" color="#000000"></a-text>
                    <a-plane id="btn-inertia-dec" class="clickable" position="-0.05 -1.3 0.05" width="0.4" height="0.4" color="#D32F2F"><a-text value="-" align="center" width="8" color="#FFF"></a-text></a-plane>
                    <a-text id="menu-inertia-val" value="80" position="0.6 -1.3 0.05" align="center" width="4.5" color="#000000"></a-text>
                    <a-plane id="btn-inertia-inc" class="clickable" position="1.35 -1.3 0.05" width="0.4" height="0.4" color="#388E3C"><a-text value="+" align="center" width="8" color="#FFF"></a-text></a-plane>

                    <a-text value="Precision" position="-1.5 -2.0 0.05" align="left" width="5.5" color="#000000"></a-text>
                    <a-plane id="btn-diff-dec" class="clickable" position="-0.05 -2.0 0.05" width="0.4" height="0.4" color="#D32F2F"><a-text value="-" align="center" width="8" color="#FFF"></a-text></a-plane>
                    <a-text id="menu-diff-val" value="Lv 1" position="0.6 -2.0 0.05" align="center" width="4.5" color="#000000"></a-text>
                    <a-plane id="btn-diff-inc" class="clickable" position="1.35 -2.0 0.05" width="0.4" height="0.4" color="#388E3C"><a-text value="+" align="center" width="8" color="#FFF"></a-text></a-plane>

                    <!-- NUOVO MENU: LIVELLO -->
                    <a-text value="Level" position="-1.5 -2.7 0.05" align="left" width="5.5" color="#000000"></a-text>
                    <a-plane id="btn-level-dec" class="clickable" position="-0.05 -2.7 0.05" width="0.4" height="0.4" color="#D32F2F"><a-text value="-" align="center" width="8" color="#FFF"></a-text></a-plane>
                    <a-text id="menu-level-val" value="Lv 1" position="0.6 -2.7 0.05" align="center" width="4.5" color="#000000"></a-text>
                    <a-plane id="btn-level-inc" class="clickable" position="1.35 -2.7 0.05" width="0.4" height="0.4" color="#388E3C"><a-text value="+" align="center" width="8" color="#FFF"></a-text></a-plane>

                    <a-text id="menu-version-val" value="v18.0.0 - Sfida 1" position="0 -3.2 0.05" align="center" width="3.2" color="#000000"></a-text>
                </a-entity>

                <a-entity id="monitor-panel" position="2.2 0 0">
                    <a-box position="0 0 -0.05" width="4.2" height="6.4" depth="0.1" color="#222"></a-box>
                    <a-text value="HOOK CAM" position="0 2.6 0.02" align="center" width="7" color="#FFEB3B"></a-text>
                    <a-text value="LIVE FEED" position="0 2.2 0.02" align="center" width="3.5" color="#FF0000"></a-text>
                    <a-plane id="hook-monitor" position="0 -0.3 0.01" width="3.8" height="4.8" color="#111"></a-plane>
                </a-entity>
            </a-entity>
        </a-entity>

        <a-entity id="rig" position="0 0 0">
            <a-camera position="0 1.5 0"></a-camera>
            <a-entity id="right-hand" oculus-touch-controls="hand: right" raycaster="objects: .clickable" laser-controls="hand: right"></a-entity>
            <a-entity id="left-hand" oculus-touch-controls="hand: left"></a-entity>
        </a-entity>
    </a-scene>
</body>
</html>
