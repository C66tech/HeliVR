<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>WebXR Game - Verti Crate Drop</title>
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script>
    // Componente custom per la resa visiva del diorama
    AFRAME.registerComponent('make-vivid', {
      init: function () {
        this.el.addEventListener('model-loaded', () => {
          const obj = this.el.getObject3D('mesh');
          if (obj) {
            obj.traverse((node) => {
              if (node.isMesh && node.material) {
                node.material.roughness = 0.35;
                node.material.metalness = 0.15;
              }
            });
          }
        });
      }
    });

    // Componente per gestire lo sgancio controllato delle casse dal Verti
    AFRAME.registerComponent('crate-dropper', {
      init: function () {
        // Pressione barra spaziatrice per sganciare la cassa
        window.addEventListener('keydown', (e) => {
          if (e.code === 'Space') {
            this.dropCrate();
          }
        });
      },
      dropCrate: function () {
        const verti = document.querySelector('#verti');
        const vertiPos = verti.getAttribute('position');
        const platforms = document.querySelectorAll('.platform');

        let targetPlatform = null;
        const dropRadius = 1.2; // Raggio di tolleranza allineamento Verti-Piattaforma

        // Cerca la piattaforma sotto il Verti
        platforms.forEach((plat) => {
          const platPos = plat.getAttribute('position');
          const dist = Math.hypot(vertiPos.x - platPos.x, vertiPos.z - platPos.z);
          if (dist < dropRadius) {
            targetPlatform = plat;
          }
        });

        if (!targetPlatform) {
          console.log("Sgancio fallito: il Verti non si trova sopra alcuna piattaforma.");
          return;
        }

        // Verifica se la piattaforma è già occupata
        const isOccupied = targetPlatform.getAttribute('data-occupied') === 'true';
        if (isOccupied) {
          console.warn("Sgancio bloccato: la piattaforma selezionata è già occupata da una cassa!");
          return;
        }

        // Crea e posiziona la cassa sulla piattaforma
        const newCrate = document.createElement('a-box');
        const platPos = targetPlatform.getAttribute('position');
        
        newCrate.setAttribute('position', `${platPos.x} ${platPos.y + 0.5} ${platPos.z}`);
        newCrate.setAttribute('depth', '0.8');
        newCrate.setAttribute('height', '0.8');
        newCrate.setAttribute('width', '0.8');
        newCrate.setAttribute('color', '#FFC65D');
        newCrate.setAttribute('class', 'crate');

        document.querySelector('a-scene').appendChild(newCrate);

        // Aggiorna lo stato della piattaforma
        targetPlatform.setAttribute('data-occupied', 'true');
        console.log("Cassa sganciata con successo!");
      }
    });
  </script>
</head>
<body>
  <a-scene crate-dropper webxr="optionalFeatures: hit-test, local-floor">

    <!-- Diorama dell'ambiente -->
    <a-gltf-model id="diorama-env" src="city.glb" make-vivid scale="25 25 25" position="0 -0.9 -3.5"></a-gltf-model>

    <!-- Telecamera Giocatore con HUD fisso sulla SINISTRA -->
    <a-entity id="rig" position="0 0 0">
      <a-camera id="player">
        <!-- HUD posizionato a sinistra (X: -1.0, Y: 0.1, Z: -1.2) -->
        <a-entity id="hud" position="-1.0 0.1 -1.2" rotation="0 15 0">
          <a-plane color="#111111" opacity="0.7" width="0.8" height="0.5" radius="0.02">
            <a-text value="VERTI STATUS" color="#00FF66" align="center" width="1.5" position="0 0.15 0.01"></a-text>
            <a-text value="PRONTO AD OPERARE" color="#FFFFFF" align="center" width="1.2" position="0 0 0.01"></a-text>
          </a-plane>
        </a-entity>
      </a-camera>
    </a-entity>

    <!-- Il Verti (Velivolo/Drone) -->
    <a-entity id="verti" position="0 2 -4">
      <a-cone color="#E74C3C" radius-bottom="0.4" radius-top="0" height="0.6" rotation="180 0 0"></a-cone>
    </a-entity>

    <!-- Piattaforme di atterraggio/sgancio -->
    <a-box class="platform" position="-2 0 -4" width="1.5" height="0.2" depth="1.5" color="#3498DB" data-occupied="false"></a-box>
    <a-box class="platform" position="0 0 -4" width="1.5" height="0.2" depth="1.5" color="#3498DB" data-occupied="false"></a-box>
    <a-box class="platform" position="2 0 -4" width="1.5" height="0.2" depth="1.5" color="#3498DB" data-occupied="false"></a-box>

    <!-- Illuminazione della scena -->
    <a-light type="ambient" intensity="0.7"></a-light>
    <a-light type="directional" position="-1 4 2" intensity="0.8"></a-light>

  </a-scene>
</body>
</html>
