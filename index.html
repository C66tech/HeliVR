<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>VR Vertibird Simulator - Raw Gamepad Polling</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script>
        // COMPONENTE 1: Polling grezzo della Gamepad API
        AFRAME.registerComponent('raw-gamepad-reader', {
            init: function () {
                this.trigger = 0;
                this.stickX = 0;
                this.textEl = this.el.querySelector('a-text');
            },
            tick: function () {
                let gp = null;
                // 1. Prova a estrarre il gamepad direttamente dal componente tracked-controls di A-Frame
                let tracked = this.el.components['tracked-controls'];
                if (tracked && tracked.controller) {
                    gp = tracked.controller;
                } else {
                    // 2. Fallback aggressivo: cerca direttamente nella Gamepad API del browser
                    let gamepads = navigator.getGamepads ? navigator.getGamepads() : [];
                    for (let i = 0; i < gamepads.length; i++) {
                        if (gamepads[i] && (gamepads[i].hand === 'right' || (gamepads[i].id && gamepads[i].id.toLowerCase().includes('right')))) {
                            gp = gamepads[i];
                            break;
                        }
                    }
                }

                if (gp) {
                    // Lettura bruta dei valori
                    this.trigger = (gp.buttons && gp.buttons.length > 0) ? gp.buttons[0].value : 0;
                    
                    if (gp.axes) {
                        if (gp.axes.length > 2) {
                            this.stickX = gp.axes[2];
                        } else if (gp.axes.length > 0) {
                            this.stickX = gp.axes[0];
                        } else {
                            this.stickX = 0;
                        }
                    }
                    
                    if (this.textEl) {
                        this.textEl.setAttribute('value', `ID: ${gp.id ? gp.id.substring(0,10) : 'OK'}\nTrig: ${this.trigger.toFixed(2)}\nX: ${this.stickX.toFixed(2)}`);
                    }
                } else {
                    this.trigger = 0;
                    this.stickX = 0;
                    if (this.textEl) {
                        this.textEl.setAttribute('value', "Controller NON rilevato\n(Sveglialo/Muovilo)");
                    }
                }

                // Invia i dati al componente di volo dell'elicottero
                let heli = document.getElementById('vertibird');
                if (heli && heli.components['vertibird-flight']) {
                    heli.components['vertibird-flight'].triggerValue = this.trigger;
                    heli.components['vertibird-flight'].stickX = this.stickX;
                }
            }
        });

        // COMPONENTE 2: Motore fisico del Vertibird
        AFRAME.registerComponent('vertibird-flight', {
            init: function () {
                this.angle = 0;
                this.height = 1.0;
                this.radius = 3.0;
                
                // Variabili che verranno aggiornate dal controller
                this.triggerValue = 0;
                this.stickX = 0;
                
                this.rotorEl = document.querySelector('#main-rotor');
                this.modelEl = document.querySelector('#heli-model');
            },
            tick: function (time, delta) {
                let dt = delta / 1000;

                // 1. Decollo e Altezza (proporzionale al grilletto)
                let targetHeight = 0.6 + (this.triggerValue * 2.5);
                this.height += (targetHeight - this.height) * dt * 3.0;

                // 2. Movimento circolare attorno al perno (levetta destra/sinistra)
                let moveSpeed = 0.8 + (this.stickX * 2.0);
                this.angle += moveSpeed * dt;
                let x = Math.cos(this.angle) * this.radius;
                let z = Math.sin(this.angle) * this.radius;
                this.el.setAttribute('position', { x: x, y: this.height, z: z });

                // 3. Tilt del muso (si abbassa quando acceleri o sali)
                let rotationY = -this.angle * (180 / Math.PI) + 180;
                if (this.modelEl) {
                    this.modelEl.setAttribute('rotation', { x: this.triggerValue * -12, y: rotationY, z: 0 });
                }

                // 4. Velocità Elica visiva
                if (this.rotorEl) {
                    if (this.triggerValue > 0.05) {
                        let speedDuration = Math.max(20, 300 - (this.triggerValue * 280));
                        this.rotorEl.setAttribute('animation', `property: rotation; to: 0 360 0; loop: true; dur: ${speedDuration}; easing: linear`);
                    } else {
                        this.rotorEl.removeAttribute('animation');
                        this.rotorEl.setAttribute('rotation', '0 0 0');
                    }
                }
            }
        });
    </script>
</head>
<body>
    <a-scene xr-mode-ui="enabled: true">
        <a-light type="ambient" color="#FFF" intensity="0.8"></a-light>
        <a-light type="directional" color="#FFF" intensity="0.8" position="-1 3 1"></a-light>

        <!-- Pavimentazione -->
        <a-box position="0 -0.5 0" width="10" height="1" depth="10" material="color: #2b2b2b"></a-box>
        
        <!-- Perno centrale -->
        <a-cylinder position="0 0 0" radius="0.2" height="1.5" color="#FFCC00"></a-cylinder>

        <!-- L'Elicottero -->
        <a-entity id="vertibird" vertibird-flight>
            <a-entity position="0 0.75 0">
                <a-box position="-1.5 0 0" width="3.0" height="0.03" depth="0.03" color="#FFCC00"></a-box>
                
                <a-entity id="heli-model" position="-3.0 0 0" rotation="0 90 0">
                    <a-box position="0 0 0" width="0.85" height="0.42" depth="0.45" material="color: #388E3C; roughness: 0.3"></a-box>
                    <a-sphere position="0.32 0 0" radius="0.22" material="color: #00E5FF; opacity: 0.65"></a-sphere>
                    <a-cylinder position="-0.75 0.05 0" radius="0.055" height="1.0" rotation="0 0 90" material="color: #2E7D32"></a-cylinder>
                    <a-box position="-1.22 0.18 0" width="0.04" height="0.28" depth="0.18" material="color: #388E3C" rotation="0 0 -15"></a-box>
                    <a-box position="-0.05 -0.37 -0.22" width="0.75" height="0.025" depth="0.035" material="color: #111"></a-box>
                    <a-box position="-0.05 -0.37 0.22" width="0.75" height="0.025" depth="0.035" material="color: #111"></a-box>

                    <a-entity position="0 0.24 0">
                        <a-cylinder position="0 0.08 0" radius="0.035" height="0.15" material="color: #111"></a-cylinder>
                        <a-sphere position="0 0.16 0" radius="0.07" material="color: #FFCC00"></a-sphere>
                        <a-box id="main-rotor" position="0 0.19 0" width="2.6" height="0.012" depth="0.1" material="color: #111"></a-box>
                    </a-entity>
                </a-entity>
            </a-entity>
        </a-entity>

        <!-- Camera e Rig VR -->
        <a-entity id="rig" position="0 1.6 3">
            <a-camera></a-camera>
            
            <!-- Controller Destro con Input e HUD integrato -->
            <a-entity id="right-hand" oculus-touch-controls="hand: right" raw-gamepad-reader>
                <a-text value="Inizializzazione HUD..." position="0 0.08 -0.05" scale="0.15 0.15 0.15" rotation="-45 0 0" color="#FF3333" align="center"></a-text>
            </a-entity>

            <!-- Controller Sinistro -->
            <a-entity id="left-hand" oculus-touch-controls="hand: left"></a-entity>
        </a-entity>
    </a-scene>
</body>
</html>
