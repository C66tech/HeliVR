<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>VR Vertibird Simulator - Inertia & Smooth Audio</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script>
        AFRAME.registerComponent('vertibird-flight', {
            init: function () {
                this.angle = 0;        // Angolo sul cerchio
                this.heliY = 0.25;     // Altezza fisica (a terra)
                this.radius = 3.0;     // Raggio dei binari
                
                // Variabili di inerzia (smoothing)
                this.currentThrottle = 0;
                this.currentStickY = 0;

                // Angoli di rotazione manuale delle pale (evita blocchi o scatti)
                this.rotorAngle = 0;
                this.tailRotorAngle = 0;
                
                this.heliWrapperEl = document.querySelector('#heli-wrapper');
                this.heliPitchEl = document.querySelector('#heli-pitch');
                this.rotorEl = document.querySelector('#main-rotor');
                this.tailRotorEl = document.querySelector('#tail-rotor');
                this.debugText = document.querySelector('#debug-text');

                // --- SISTEMA AUDIO (Ronzio motore con Web Audio API) ---
                this.audioCtx = null;
                this.oscillator = null;
                this.gainNode = null;
                this.audioInitialized = false;

                this.initAudio = () => {
                    if (this.audioInitialized) {
                        if (this.audioCtx && this.audioCtx.state === 'suspended') {
                            this.audioCtx.resume();
                        }
                        return;
                    }
                    try {
                        window.AudioContext = window.AudioContext || window.webkitAudioContext;
                        this.audioCtx = new AudioContext();
                        
                        this.oscillator = this.audioCtx.createOscillator();
                        this.oscillator.type = 'sawtooth'; // Tono metallico da motore
                        this.oscillator.frequency.setValueAtTime(40, this.audioCtx.currentTime);

                        this.gainNode = this.audioCtx.createGain();
                        this.gainNode.gain.setValueAtTime(0.0, this.audioCtx.currentTime);

                        this.oscillator.connect(this.gainNode);
                        this.gainNode.connect(this.audioCtx.destination);
                        this.oscillator.start();
                        
                        this.audioInitialized = true;
                    } catch (e) {}
                };

                window.addEventListener('click', this.initAudio);
                window.addEventListener('touchstart', this.initAudio);
            },
            tick: function (time, delta) {
                let dt = delta / 1000;
                let trigger = 0;
                let stickY = 0;
                let controllerActive = false;

                // --- 1. LETTURA INPUT (Polling Blindato) ---
                let xrSession = this.el.sceneEl.renderer ? this.el.sceneEl.renderer.xr.getSession() : null;
                if (xrSession && xrSession.inputSources) {
                    for (let source of xrSession.inputSources) {
                        if (source.handedness === 'right' && source.gamepad) {
                            trigger = source.gamepad.buttons[0] ? source.gamepad.buttons[0].value : 0;
                            stickY = source.gamepad.axes.length >= 4 ? source.gamepad.axes[3] : (source.gamepad.axes.length >= 2 ? source.gamepad.axes[1] : 0);
                            controllerActive = true;
                            break;
                        }
                    }
                }
                if (!controllerActive) {
                    let gamepads = navigator.getGamepads ? navigator.getGamepads() : [];
                    for (let gp of gamepads) {
                        if (gp && gp.connected && (gp.hand === 'right' || (gp.id && gp.id.toLowerCase().includes('right')))) {
                            trigger = gp.buttons[0] ? gp.buttons[0].value : 0;
                            stickY = gp.axes.length >= 4 ? gp.axes.length >= 4 ? gp.axes[3] : 0 : (gp.axes.length >= 2 ? gp.axes[1] : 0);
                            controllerActive = true;
                            break;
                        }
                    }
                }

                // Attiva l'audio non appena premi il grilletto o tocchi il controller
                if (trigger > 0.02) {
                    this.initAudio();
                }

                // Deadzone per levetta e grilletto
                if (Math.abs(stickY) < 0.15) stickY = 0;
                if (trigger < 0.02) trigger = 0;

                // --- 2. INERZIA E SMOOTHING (Reattività graduale) ---
                // Il gas e la levetta si muovono dolcemente verso il valore desiderato
                this.currentThrottle += (trigger - this.currentThrottle) * dt * 4.0;
                this.currentStickY += (stickY - this.currentStickY) * dt * 5.0;

                if (this.debugText) {
                    this.debugText.setAttribute('value', controllerActive ? 
                        `Gas: ${(this.currentThrottle*100).toFixed(0)}%\nStick: ${this.currentStickY.toFixed(2)}` : 
                        "Sveglia Controller");
                }

                // --- 3. FISICA DELL'ALTEZZA ---
                let targetHeliY = 0.25 + (this.currentThrottle * 2.75);
                this.heliY += (targetHeliY - this.heliY) * dt * 3.5;
                if (this.heliY < 0.25) this.heliY = 0.25;

                // Inclinazione dell'asta (Cerniera Z)
                let hingeAngleRad = Math.asin((this.heliY - 0.75) / this.radius);
                let hingeAngleDeg = hingeAngleRad * (180 / Math.PI);

                // --- 4. BINARI CIRCOLARI (Senso Antiorario) ---
                let speedFactor = -this.currentStickY; 
                this.angle += speedFactor * 0.8 * dt;

                // Applica rotazione globale all'asta
                this.el.setAttribute('rotation', { x: 0, y: this.angle, z: hingeAngleDeg });

                // --- 5. ASSETTO E INCLINAZIONE DEL MUSO (Pitch con inerzia) ---
                if (this.heliWrapperEl) {
                    this.heliWrapperEl.setAttribute('rotation', { x: 0, y: 0, z: -hingeAngleDeg });
                }

                if (this.heliPitchEl) {
                    let pitchAngle = speedFactor * 18.0; 
                    this.heliPitchEl.setAttribute('rotation', { x: 0, y: 0, z: pitchAngle });
                }

                // --- 6. ROTAZIONE MANUALE DELLE PALE (Fluida e senza blocchi) ---
                if (this.currentThrottle > 0.01) {
                    // Velocità di rotazione proporzionale al gas attuale
                    let rotSpeed = this.currentThrottle * 2500; 
                    this.rotorAngle += rotSpeed * dt;
                    this.tailRotorAngle += (rotSpeed * 2.5) * dt;

                    if (this.rotorEl) {
                        this.rotorEl.setAttribute('rotation', `0 ${this.rotorAngle % 360} 0`);
                    }
                    if (this.tailRotorEl) {
                        this.tailRotorEl.setAttribute('rotation', `${this.tailRotorAngle % 360} 0 0`);
                    }
                }

                // --- 7. AGGIORNAMENTO AUDIO (Ronzio proporzionale) ---
                if (this.audioInitialized && this.oscillator && this.gainNode && this.audioCtx) {
                    let targetFreq = 45 + (this.currentThrottle * 190);
                    let targetVolume = this.currentThrottle > 0.01 ? 0.15 : 0.0;
                    this.oscillator.frequency.setTargetAtTime(targetFreq, this.audioCtx.currentTime, 0.1);
                    this.gainNode.gain.setTargetAtTime(targetVolume, this.audioCtx.currentTime, 0.1);
                }
            }
        });
    </script>
</head>
<body>
    <a-scene xr-mode-ui="enabled: true">
        <a-light type="ambient" color="#FFF" intensity="0.8"></a-light>
        <a-light type="directional" color="#FFF" intensity="0.8" position="-1 3 1"></a-light>

        <!-- Pavimentazione / Piano d'atterraggio -->
        <a-box position="0 -0.05 0" width="10" height="0.1" depth="10" material="color: #2b2b2b"></a-box>
        
        <!-- Perno Centrale (Centro del cerchio dei binari) -->
        <a-cylinder position="0 0.75 0" radius="0.15" height="1.5" color="#FFCC00"></a-cylinder>

        <!-- CERNIERA E ASTA DEL VERTIBIRD -->
        <a-entity id="vertibird" position="0 0.75 0" vertibird-flight>
            
            <!-- Asta Meccanica -->
            <a-box id="rod" position="1.5 0 0" width="3.0" height="0.02" depth="0.02" color="#FFCC00"></a-box>
            
            <!-- Wrapper Elicottero -->
            <a-entity id="heli-wrapper" position="3.0 0 0">
                
                <!-- Tangente al cerchio (Muso rivolto in senso antiorario) -->
                <a-entity id="heli-yaw" rotation="0 90 0">
                    
                    <!-- Pitch: Inclinazione avanti/indietro del muso -->
                    <a-entity id="heli-pitch" rotation="0 0 0">
                        
                        <!-- Modello Elicottero Verde Militare -->
                        <a-box position="0 0 0" width="0.85" height="0.42" depth="0.45" material="color: #388E3C; roughness: 0.3"></a-box>
                        <a-sphere position="0.32 0 0" radius="0.22" material="color: #00E5FF; opacity: 0.65"></a-sphere>
                        <a-cylinder position="-0.75 0.05 0" radius="0.055" height="1.0" rotation="0 0 90" material="color: #2E7D32"></a-cylinder>
                        <a-box position="-1.22 0.18 0" width="0.04" height="0.28" depth="0.18" material="color: #388E3C" rotation="0 0 -15"></a-box>
                        
                        <!-- Pattini d'atterraggio -->
                        <a-box position="-0.05 -0.25 -0.22" width="0.75" height="0.025" depth="0.035" material="color: #111"></a-box>
                        <a-box position="-0.05 -0.25 0.22" width="0.75" height="0.025" depth="0.035" material="color: #111"></a-box>

                        <!-- Rotore Principale -->
                        <a-entity position="0 0.24 0">
                            <a-cylinder position="0 0.08 0" radius="0.035" height="0.15" material="color: #111"></a-cylinder>
                            <a-sphere position="0 0.16 0" radius="0.07" material="color: #FFCC00"></a-sphere>
                            <a-box id="main-rotor" position="0 0.19 0" width="2.6" height="0.012" depth="0.1" material="color: #111"></a-box>
                        </a-entity>

                        <!-- Rotore di Coda -->
                        <a-entity position="-1.28 0.05 -0.05" rotation="90 0 0">
                            <a-box id="tail-rotor" width="0.35" height="0.01" depth="0.07" material="color: #111"></a-box>
                        </a-entity>

                    </a-entity>
                </a-entity>
            </a-entity>
        </a-entity>

        <!-- Camera e Giocatore -->
        <a-entity id="rig" position="0 0 5.5">
            <a-camera position="0 1.5 0"></a-camera>
            
            <a-entity id="right-hand" oculus-touch-controls="hand: right">
                <a-text id="debug-text" value="Pronto" position="0 0.08 -0.05" scale="0.15 0.15 0.15" rotation="-45 0 0" color="#00FF66" align="center"></a-text>
            </a-entity>
            <a-entity id="left-hand" oculus-touch-controls="hand: left"></a-entity>
        </a-entity>
    </a-scene>
</body>
</html>
