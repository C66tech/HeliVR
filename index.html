<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Quest 3 Right Controller Test</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script>
        AFRAME.register-component('quest-diagnostics', {
            init: function () {
                this.debugText = document.querySelector('#debug-text');
                this.rightHand = document.querySelector('#right-hand');

                this.triggerState = "Rilasciato (0.0)";
                this.stickState = "X: 0.0, Y: 0.0";
                this.isConnected = "No";

                if (this.rightHand) {
                    // Eventi di connessione del controller
                    this.rightHand.addEventListener('connected', (evt) => {
                        this.isConnected = "Sì (" + (evt.detail.name || "Meta Quest Touch") + ")";
                    });
                    this.rightHand.addEventListener('disconnected', () => {
                        this.isConnected = "Disconnesso";
                    });

                    // Eventi del grilletto destro
                    this.rightHand.addEventListener('triggerdown', () => {
                        this.triggerState = "PREMUTO (1.0)";
                    });
                    this.rightHand.addEventListener('triggerup', () => {
                        this.triggerState = "Rilasciato (0.0)";
                    });

                    // Eventi della levetta analogica (Thumbstick)
                    this.rightHand.addEventListener('thumbstickmoved', (evt) => {
                        let x = evt.detail.x.toFixed(2);
                        let y = evt.detail.y.toFixed(2);
                        this.stickState = `X: ${x}, Y: ${y}`;
                    });
                }
            },
            tick: function () {
                if (this.debugText) {
                    let text = "=== CONTROLLER DESTRO QUEST 3 ===\n\n" +
                               "Connesso: " + this.isConnected + "\n" +
                               "Grilletto (Trigger): " + this.triggerState + "\n" +
                               "Levetta (Thumbstick): " + this.stickState + "\n\n" +
                               "(Indossa il visore, entra in VR\ne premi il grilletto o muovi la levetta)";
                    
                    this.debugText.setAttribute('value', text);
                }
            }
        });
    </script>
</head>
<body>
    <a-scene xr-mode-ui="enabled: true" quest-diagnostics>
        <a-light type="ambient" color="#FFF" intensity="1"></a-light>

        <!-- Sfondo di riferimento -->
        <a-plane position="0 0 -5" width="20" height="20" color="#1a1a1a"></a-plane>

        <!-- Pannello HUD fluttuante davanti agli occhi -->
        <a-entity position="0 1.6 -1.8">
            <a-plane width="2.6" height="1.4" color="#000000" opacity="0.9" material="shader: flat"></a-plane>
            <a-text id="debug-text" value="In attesa di ingresso in VR..." position="0 0 0.01" align="center" color="#00FF66" width="3.2" font="monoid"></a-text>
        </a-entity>

        <!-- Camera e Rig VR con supporto esclusivo al controller destro -->
        <a-entity id="rig" position="0 0 0">
            <a-camera position="0 1.6 0"></a-camera>
            <a-entity id="right-hand" oculus-touch-controls="hand: right"></a-entity>
        </a-entity>
    </a-scene>
</body>
</html>
