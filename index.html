<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>VertiVR Simulator - Real 3D Vector Collision v2.4.0</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script>
        AFRAME.registerComponent('vertibird-flight', {
            init: function () {
                this.version = "2.4.0"; 
                this.angle = 0;        
                this.heliY = 0.39;     
                this.minHeliY = 0.39;  
                this.radius = 4.5;     
                
                this.currentThrottle = 0;
                this.currentStickY = 0;

                // --- INERZIA MOTO CIRCOLARE ---
                this.angularVelocity = 0; 

                // Parametri Menu
                this.speedMultiplier = 90.0; 
                this.wobbleAmplitude = 0;   
                this.inertiaValue = 20;     

                this.rotorAngle = 0;
                this.currentAngularSpeed = 0; 

                // Gestione World Root
                this.worldRoot = document.querySelector('#world-root');
                this.currentScale = 0.06; 
                this.isDragging = false;
                
                this.initialControllerMatrixInv = new THREE.Matrix4();
                this.initialWorldMatrix = new THREE.Matrix4();
                
                this.heliWrapperEl = document.querySelector('#heli-wrapper');
                this.heliPitchEl = document.querySelector('#heli-pitch');
                this.rotorEl = document.querySelector('#main-rotor');
                this.rightHandEl = document.querySelector('#right-hand');
                this.leftHandEl = document.querySelector('#left-hand');

                // Elementi Silos, Pila e Target
                this.siloStackEl = document.querySelector('#silo-stack');
                this.targetDisplayEl = document.querySelector('#target-display');
                this.stackedCubes = [];
                this.stackedColors = [];
                this.cubeHeight = 0.25;

                // Stato Gioco / Livelli
                this.currentLevel = 1;
                this.availableColors = ['#E53935', '#4CAF50', '#1E88E5', '#8E24AA', '#FB8C00'];
                this.targetSequence = [];
                this.canUndo = true;

                // Configurazione Sfere Colorate
                this.spheres = [
                    { id: 'sphere-1', color: '#E53935', active: true, timer: null }, // Rosso
                    { id: 'sphere-2', color: '#4CAF50', active: true, timer: null }, // Verde
                    { id: 'sphere-3', color: '#1E88E5', active: true, timer: null }, // Blu
                    { id: 'sphere-4', color: '#8E24AA', active: true, timer: null }, // Viola
                    { id: 'sphere-5', color: '#FB8C00', active: true, timer: null }  // Arancione
                ];

                // Elementi Menu
                this.speedText = document.querySelector('#menu-speed-val');
                this.windText = document.querySelector('#menu-wind-val');
                this.inertiaText = document.querySelector('#menu-inertia-val');
                this.versionText = document.querySelector('#menu-version-val');

                if (this.worldRoot && this.worldRoot.object3D) {
                    this.worldRoot.object3D.scale.set(this.currentScale, this.currentScale, this.currentScale);
                }

                // Generazione Schema Obiettivo Iniziale
                this.generateLevelTarget();

                // --- SISTEMA AUDIO WEB AUDIO API ---
                this.audioCtx = null;
                this.oscillator = null;
                this.gainNode = null;
                this.windOsc = null;
                this.windFilter = null;
                this.windGain = null;
                this.audioInitialized = false;

                this.initAudio = () => {
                    if (this.audioInitialized) {
                        if (this.audioCtx && this.audioCtx.state === 'suspended') {
                            this.audioCtx.resume();
                        }
                        return;
                    }
                    try {
                        window.AudioContext = window.AudioContext || window.webkitAudioContext;
                        this.audioCtx = new AudioContext();
                        
                        this.oscillator = this.audioCtx.createOscillator();
                        this.oscillator.type = 'sawtooth';
                        this.oscillator.frequency.setValueAtTime(30, this.audioCtx.currentTime);

                        this.gainNode = this.audioCtx.createGain();
                        this.gainNode.gain.setValueAtTime(0.0, this.audioCtx.currentTime);

                        this.oscillator.connect(this.gainNode);
                        this.gainNode.connect(this.audioCtx.destination);
                        this.oscillator.start();

                        this.windOsc = this.audioCtx.createOscillator();
                        this.windOsc.type = 'sawtooth'; 
                        this.windOsc.frequency.setValueAtTime(250, this.audioCtx.currentTime);

                        this.windFilter = this.audioCtx.createBiquadFilter();
                        this.windFilter.type = 'bandpass';
                        this.windFilter.frequency.setValueAtTime(400, this.audioCtx.currentTime);
                        this.windFilter.Q.setValueAtTime(4.0, this.audioCtx.currentTime); 

                        this.windGain = this.audioCtx.createGain();
                        this.windGain.gain.setValueAtTime(0.0, this.audioCtx.currentTime);

                        this.windOsc.connect(this.windFilter);
                        this.windFilter.connect(this.windGain);
                        this.windGain.connect(this.audioCtx.destination);
                        this.windOsc.start();
                        
                        this.audioInitialized = true;
                    } catch (e) {}
                };

                window.addEventListener('click', this.initAudio);
                window.addEventListener('touchstart', this.initAudio);

                // --- EFFETTI SONORI SINTETIZZATI (BANG & PLOP) ---
                this.playBangSound = () => {
                    if (!this.audioCtx) return;
                    try {
                        let now = this.audioCtx.currentTime;
                        let bufferSize = this.audioCtx.sampleRate * 0.18; 
                        let buffer = this.audioCtx.createBuffer(1, bufferSize, this.audioCtx.sampleRate);
                        let data = buffer.getChannelData(0);
                        for (let i = 0; i < bufferSize; i++) {
                            data[i] = Math.random() * 2 - 1;
                        }
                        let noise = this.audioCtx.createBufferSource();
                        noise.buffer = buffer;

                        let filter = this.audioCtx.createBiquadFilter();
                        filter.type = 'lowpass';
                        filter.frequency.setValueAtTime(900, now);
                        filter.frequency.exponentialRampToValueAtTime(60, now + 0.18);

                        let gain = this.audioCtx.createGain();
                        gain.gain.setValueAtTime(0.85, now);
                        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.18);

                        noise.connect(filter);
                        filter.connect(gain);
                        gain.connect(this.audioCtx.destination);
                        noise.start(now);
                    } catch(e) {}
                };

                this.playPlopSound = () => {
                    if (!this.audioCtx) return;
                    try {
                        let now = this.audioCtx.currentTime;
                        let osc = this.audioCtx.createOscillator();
                        let gain = this.audioCtx.createGain();

                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(160, now);
                        osc.frequency.exponentialRampToValueAtTime(480, now + 0.1);

                        gain.gain.setValueAtTime(0.5, now);
                        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);

                        osc.connect(gain);
                        gain.connect(this.audioCtx.destination);
                        osc.start(now);
                        osc.stop(now + 0.1);
                    } catch(e) {}
                };

                // --- SCALING CON TASTI A E B ---
                const applyScale = (delta) => {
                    this.currentScale = Math.min(3.0, Math.max(0.02, this.currentScale + delta));
                    if (this.worldRoot && this.worldRoot.object3D) {
                        this.worldRoot.object3D.scale.set(this.currentScale, this.currentScale, this.currentScale);
                        this.worldRoot.object3D.updateMatrixWorld(true);
                    }
                };

                this.rightHandEl.addEventListener('abuttondown', () => applyScale(-0.04));
                this.rightHandEl.addEventListener('bbuttondown', () => applyScale(0.04));

                // --- LOGICA PULSANTI MENU ---
                this.updateMenuUI = () => {
                    if (this.speedText) this.speedText.setAttribute('value', `${this.speedMultiplier.toFixed(0)} deg/s`);
                    if (this.windText) this.windText.setAttribute('value', `${this.wobbleAmplitude.toFixed(0)}`);
                    if (this.inertiaText) this.inertiaText.setAttribute('value', `${this.inertiaValue.toFixed(0)}`);
                    if (this.versionText) this.versionText.setAttribute('value', `v${this.version}`);
                };

                let btnSpeedDec = document.querySelector('#btn-speed-dec');
                let btnSpeedInc = document.querySelector('#btn-speed-inc');
                let btnWindDec = document.querySelector('#btn-wind-dec');
                let btnWindInc = document.querySelector('#btn-wind-inc');
                let btnInertiaDec = document.querySelector('#btn-inertia-dec');
                let btnInertiaInc = document.querySelector('#btn-inertia-inc');

                if (btnSpeedDec) btnSpeedDec.addEventListener('click', () => {
                    this.speedMultiplier = Math.max(10.0, this.speedMultiplier - 15.0);
                    this.updateMenuUI();
                });
                if (btnSpeedInc) btnSpeedInc.addEventListener('click', () => {
                    this.speedMultiplier = Math.min(300.0, this.speedMultiplier + 15.0);
                    this.updateMenuUI();
                });
                if (btnWindDec) btnWindDec.addEventListener('click', () => {
                    this.wobbleAmplitude = Math.max(0, this.wobbleAmplitude - 10);
                    this.updateMenuUI();
                });
                if (btnWindInc) btnWindInc.addEventListener('click', () => {
                    this.wobbleAmplitude = Math.min(150, this.wobbleAmplitude + 10);
                    this.updateMenuUI();
                });
                if (btnInertiaDec) btnInertiaDec.addEventListener('click', () => {
                    this.inertiaValue = Math.max(0, this.inertiaValue - 10);
                    this.updateMenuUI();
                });
                if (btnInertiaInc) btnInertiaInc.addEventListener('click', () => {
                    this.inertiaValue = Math.min(100, this.inertiaValue + 10);
                    this.updateMenuUI();
                });

                this.updateMenuUI();
            },

            generateLevelTarget: function() {
                this.targetSequence = [];
                let targetLength = Math.min(5, 2 + this.currentLevel);

                for (let i = 0; i < targetLength; i++) {
                    let randColor = this.availableColors[Math.floor(Math.random() * this.availableColors.length)];
                    this.targetSequence.push(randColor);
                }
                this.renderTargetDisplay();
            },

            renderTargetDisplay: function() {
                if (!this.targetDisplayEl) return;
                this.targetDisplayEl.innerHTML = '';

                let titleText = document.createElement('a-text');
                titleText.setAttribute('value', `LEVEL ${this.currentLevel} TARGET`);
                titleText.setAttribute('position', '0 1.2 0');
                titleText.setAttribute('align', 'center');
                titleText.setAttribute('width', '3');
                titleText.setAttribute('color', '#111');
                this.targetDisplayEl.appendChild(titleText);

                this.targetSequence.forEach((color, idx) => {
                    let sphereTarget = document.createElement('a-sphere');
                    sphereTarget.setAttribute('radius', '0.08');
                    let startX = -((this.targetSequence.length - 1) * 0.22) / 2;
                    sphereTarget.setAttribute('position', `${startX + (idx * 0.22)} 0.9 0`);
                    sphereTarget.setAttribute('material', `color: ${color}; roughness: 0.2`);
                    this.targetDisplayEl.appendChild(sphereTarget);
                });
            },

            spawnCubeInSilo: function(color) {
                if (!this.siloStackEl) return;

                let cubeCount = this.stackedCubes.length;
                let targetY = 0.125 + (cubeCount * this.cubeHeight);

                let newCube = document.createElement('a-box');
                newCube.setAttribute('width', '0.28');
                newCube.setAttribute('height', '0.24');
                newCube.setAttribute('depth', '0.28');
                newCube.setAttribute('position', `0 ${targetY} 0`);
                newCube.setAttribute('material', `color: ${color}; roughness: 0.3; metalness: 0.1`);

                this.siloStackEl.appendChild(newCube);
                this.stackedCubes.push(newCube);
                this.stackedColors.push(color);

                this.checkLevelCompletion();
            },

            popLastCubeFromSilo: function() {
                if (this.stackedCubes.length === 0) return;

                let lastCube = this.stackedCubes.pop();
                this.stackedColors.pop();
                if (lastCube && lastCube.parentNode) {
                    lastCube.parentNode.removeChild(lastCube);
                }
            },

            checkLevelCompletion: function() {
                if (this.stackedColors.length < this.targetSequence.length) return;

                let isCorrect = true;
                for (let i = 0; i < this.targetSequence.length; i++) {
                    if (this.stackedColors[i] !== this.targetSequence[i]) {
                        isCorrect = false;
                        break;
                    }
                }

                if (isCorrect) {
                    setTimeout(() => {
                        alert(`LIVELLO ${this.currentLevel} SUPERATO!`);
                        this.currentLevel++;
                        this.clearSiloStack();
                        this.generateLevelTarget();
                    }, 300);
                }
            },

            clearSiloStack: function() {
                while (this.stackedCubes.length > 0) {
                    this.popLastCubeFromSilo();
                }
            },

            // --- ESPLOSIONE E RIGENERAZIONE SFERA ---
            triggerSphereExplosion: function(sphereObj) {
                sphereObj.active = false;
                let sphereEl = document.querySelector(`#${sphereObj.id}`);
                
                this.playBangSound();
                if (sphereEl) {
                    sphereEl.setAttribute('visible', 'false');
                }

                // Rigenerazione dopo 5 secondi
                sphereObj.timer = setTimeout(() => {
                    sphereObj.active = true;
                    if (sphereEl) {
                        sphereEl.setAttribute('visible', 'true');
                        this.playPlopSound();
                    }
                }, 5000);
            },

            tick: function (time, delta) {
                let dt = delta / 1000;
                let t = time / 1000; 
                
                let leftTrigger = 0;
                let rightGrip = 0;
                let rightStickY = 0;

                // --- 1. LETTURA INPUT WEBXR ---
                let xrSession = this.el.sceneEl.renderer ? this.el.sceneEl.renderer.xr.getSession() : null;
                if (xrSession && xrSession.inputSources) {
                    for (let source of xrSession.inputSources) {
                        if (source.handedness === 'left' && source.gamepad) {
                            let gp = source.gamepad;
                            leftTrigger = gp.buttons[0] ? gp.buttons[0].value : 0;
                        }
                        if (source.handedness === 'right' && source.gamepad) {
                            let gp = source.gamepad;
                            rightGrip = gp.buttons[1] ? (gp.buttons[1].value || (gp.buttons[1].pressed ? 1 : 0)) : 0;
                            rightStickY = gp.axes.length >= 4 ? gp.axes[3] : (gp.axes.length >= 2 ? gp.axes[1] : 0);
                        }
                    }
                } else {
                    let gamepads = navigator.getGamepads ? navigator.getGamepads() : [];
                    for (let g of gamepads) {
                        if (g && g.connected) {
                            if (g.hand === 'left' || (g.id && g.id.toLowerCase().includes('left'))) {
                                leftTrigger = g.buttons[0] ? g.buttons[0].value : 0;
                            }
                            if (g.hand === 'right' || (g.id && g.id.toLowerCase().includes('right'))) {
                                rightGrip = g.buttons[1] ? (g.buttons[1].value || (g.buttons[1].pressed ? 1 : 0)) : 0;
                                rightStickY = g.axes.length >= 4 ? g.axes[3] : (g.axes.length >= 2 ? g.axes[1] : 0);
                            }
                        }
                    }
                }

                if (leftTrigger > 0.02) {
                    this.initAudio();
                }

                if (Math.abs(rightStickY) < 0.15) rightStickY = 0;
                if (leftTrigger < 0.02) leftTrigger = 0;

                // --- 2. LOGICA GRAB DEL DIORAMA ---
                if (this.rightHandEl && this.rightHandEl.object3D && this.worldRoot && this.worldRoot.object3D) {
                    let handObj = this.rightHandEl.object3D;
                    
                    if (rightGrip > 0.5) {
                        handObj.updateMatrixWorld(true);
                        this.worldRoot.object3D.updateMatrixWorld(true);

                        if (!this.isDragging) {
                            this.isDragging = true;
                            this.initialControllerMatrixInv.copy(handObj.matrixWorld).invert();
                            this.initialWorldMatrix.copy(this.worldRoot.object3D.matrixWorld);
                        } else {
                            let currentControllerMatrix = handObj.matrixWorld;
                            let deltaMatrix = currentControllerMatrix.clone().multiply(this.initialControllerMatrixInv);
                            let targetMatrix = deltaMatrix.clone().multiply(this.initialWorldMatrix);

                            let p = new THREE.Vector3();
                            let q = new THREE.Quaternion();
                            let s = new THREE.Vector3();
                            targetMatrix.decompose(p, q, s);

                            let euler = new THREE.Euler().setFromQuaternion(q, 'YXZ');
                            q.setFromEuler(new THREE.Euler(0, euler.y, 0, 'YXZ'));

                            this.worldRoot.object3D.position.copy(p);
                            this.worldRoot.object3D.quaternion.copy(q);
                            this.worldRoot.object3D.updateMatrixWorld(true);
                        }
                    } else {
                        this.isDragging = false;
                    }
                }

                // --- 3. INERZIA INPUT MANO ---
                this.currentThrottle += (leftTrigger - this.currentThrottle) * dt * 5.0;
                this.currentStickY += (rightStickY - this.currentStickY) * dt * 6.0;

                // --- 4. WOBBLING ---
                let wobbleThrottleOffset = 0;
                let wobbleStickOffset = 0;

                let isAirborne = this.heliY > (this.minHeliY + 0.005);

                if (this.wobbleAmplitude > 0 && isAirborne) {
                    let normWobble = this.wobbleAmplitude / 100.0;
                    wobbleThrottleOffset = ((Math.sin(t * 2.3) * 0.05) + (Math.cos(t * 4.7) * 0.025)) * normWobble;
                    wobbleStickOffset = ((Math.sin(t * 1.9) * 0.08) + (Math.cos(t * 3.8) * 0.04)) * normWobble;
                }

                let effectiveThrottleInput = Math.max(0, Math.min(1.0, this.currentThrottle + wobbleThrottleOffset));
                let effectiveStickYInput = Math.max(-1.0, Math.min(1.0, this.currentStickY + wobbleStickOffset));

                // --- 5. FISICA DELL'ALTEZZA ---
                let takeoffThreshold = 0.35; 
                let effectiveThrottle = 0;
                let maxFlightHeight = 2.42;
                
                if (effectiveThrottleInput > takeoffThreshold) {
                    effectiveThrottle = (effectiveThrottleInput - takeoffThreshold) / (1.0 - takeoffThreshold);
                }

                let targetHeliY = this.minHeliY + (effectiveThrottle * maxFlightHeight);
                this.heliY += (targetHeliY - this.heliY) * dt * 4.0;
                if (this.heliY < this.minHeliY) this.heliY = this.minHeliY;

                let hingeAngleRad = Math.asin((this.heliY - 1.1) / this.radius);
                let hingeAngleDeg = hingeAngleRad * (180 / Math.PI);

                // --- 6. ASSETTO DEL MUSO ---
                let speedFactor = effectiveStickYInput; 
                let pitchAngle = speedFactor * 15.0; 
                
                if (this.heliWrapperEl) {
                    this.heliWrapperEl.setAttribute('rotation', { x: 0, y: 0, z: -hingeAngleDeg });
                }

                if (this.heliPitchEl) {
                    this.heliPitchEl.setAttribute('rotation', { x: 0, y: 0, z: pitchAngle });
                }

                // --- 7. MOTO CIRCOLARE CON INERZIA ---
                if (isAirborne) {
                    let targetSpeed = -speedFactor * effectiveThrottleInput * this.speedMultiplier;

                    if (this.inertiaValue <= 0) {
                        this.angularVelocity = targetSpeed;
                    } else {
                        let inertiaFactor = this.inertiaValue / 100.0;
                        let accelRate = 0.5 + ((1.0 - inertiaFactor) * 12.0); 
                        let friction = 0.3 + ((1.0 - inertiaFactor) * 8.0);   

                        let thrust = (targetSpeed - this.angularVelocity) * accelRate;
                        this.angularVelocity += thrust * dt;

                        if (Math.abs(targetSpeed) < 0.05) {
                            this.angularVelocity -= this.angularVelocity * friction * dt;
                        }
                    }
                } else {
                    if (this.inertiaValue <= 0) {
                        this.angularVelocity = 0;
                    } else {
                        let inertiaFactor = this.inertiaValue / 100.0;
                        let groundFriction = 2.5 + ((1.0 - inertiaFactor) * 8.0); 
                        this.angularVelocity -= this.angularVelocity * groundFriction * dt;

                        if (Math.abs(this.angularVelocity) < 0.2) {
                            this.angularVelocity = 0;
                        }
                    }
                }

                this.angle += this.angularVelocity * dt;
                this.currentAngularSpeed = Math.abs(this.angularVelocity);

                this.el.setAttribute('rotation', { x: 0, y: this.angle, z: hingeAngleDeg });

                // --- CALCOLO POSIZIONE 3D REALE DEL VERTIBIRD ---
                let heliLocalPos = new THREE.Vector3();
                if (this.heliPitchEl && this.heliPitchEl.object3D && this.worldRoot && this.worldRoot.object3D) {
                    this.heliPitchEl.object3D.getWorldPosition(heliLocalPos);
                    this.worldRoot.object3D.worldToLocal(heliLocalPos);
                }

                // --- CHECK ATTERRAGGIO SU PIATTAFORMA A SUD (UNDO PLATFORM) ---
                let southPos = new THREE.Vector3(0, 0.2, 4.5);
                let distToSouth = heliLocalPos.distanceTo(southPos);

                if (!isAirborne && distToSouth < 0.8) {
                    if (this.canUndo) {
                        this.canUndo = false;
                        this.popLastCubeFromSilo();
                    }
                } else if (distToSouth > 1.2 || isAirborne) {
                    this.canUndo = true; 
                }

                // --- CHECK COLLISIONE REALE 3D CON SFERE COLORATE ---
                this.spheres.forEach(s => {
                    if (!s.active) return; 

                    let sphereEl = document.querySelector(`#${s.id}`);
                    if (sphereEl && sphereEl.object3D) {
                        let distToSphere = heliLocalPos.distanceTo(sphereEl.object3D.position);

                        // Impatto metrico reale (Soglia < 0.55m nello spazio locale)
                        if (distToSphere < 0.55) {
                            this.spawnCubeInSilo(s.color);
                            this.triggerSphereExplosion(s);
                        }
                    }
                });

                // --- 8. ROTAZIONE PALA PRINCIPALE ---
                if (this.currentThrottle > 0.01) {
                    let rotSpeed = effectiveThrottleInput * 4000; 
                    this.rotorAngle += rotSpeed * dt;

                    if (this.rotorEl) {
                        this.rotorEl.setAttribute('rotation', `0 ${this.rotorAngle % 360} 0`);
                    }
                }

                // --- 9. AUDIO DOPPIO ---
                if (this.audioInitialized && this.audioCtx) {
                    let targetFreq = 30 + (effectiveThrottleInput * 70);
                    let targetVolume = effectiveThrottleInput > 0.01 ? 0.18 : 0.0;
                    this.oscillator.frequency.setTargetAtTime(targetFreq, this.audioCtx.currentTime, 0.1);
                    this.gainNode.gain.setTargetAtTime(targetVolume, this.audioCtx.currentTime, 0.1);

                    let normRadialSpeed = Math.min(1.0, this.currentAngularSpeed / 250.0);
                    let targetWindOscFreq = 250 + (normRadialSpeed * 600);    
                    let targetFilterFreq = 400 + (normRadialSpeed * 2400);   
                    let targetWindVol = normRadialSpeed > 0.02 ? (normRadialSpeed * 0.38) : 0.0; 

                    this.windOsc.frequency.setTargetAtTime(targetWindOscFreq, this.audioCtx.currentTime, 0.05);
                    this.windFilter.frequency.setTargetAtTime(targetFilterFreq, this.audioCtx.currentTime, 0.05);
                    this.windGain.gain.setTargetAtTime(targetWindVol, this.audioCtx.currentTime, 0.05);
                }
            }
        });
    </script>
    <style>
        #ar-button-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 9999;
        }
        .custom-ar-btn {
            background-color: #2e7d32;
            color: white;
            border: 2px solid #4caf50;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: background 0.2s;
        }
        .custom-ar-btn:hover {
            background-color: #388e3c;
        }
    </style>
</head>
<body>
    <div id="ar-button-container">
        <button class="custom-ar-btn" onclick="document.querySelector('a-scene').enterAR()">ENTRA IN AR (PASSTHROUGH)</button>
    </div>

    <a-scene xr-mode-ui="enabled: true">
        <a-assets>
            <img id="terrain-img" src="terreno.jpg" crossorigin="anonymous">
            <img id="menu-bg" src="VertiVRMenu.jpg" crossorigin="anonymous">
        </a-assets>

        <a-light type="ambient" color="#FFF" intensity="0.8"></a-light>
        <a-light type="directional" color="#FFF" intensity="0.8" position="-1 3 1"></a-light>

        <!-- CONTENITORE GLOBALE DEL DIORAMA -->
        <a-entity id="world-root" position="0 0.8 -0.8" rotation="0 0 0" scale="0.06 0.06 0.06">
            
            <!-- Base con texture JPG -->
            <a-box position="0 -0.05 0" width="12" height="0.1" depth="12" material="src: #terrain-img; roughness: 0.8"></a-box>
            
            <!-- STACCIONATA ARANCIONE SCURO -->
            <a-entity id="fence">
                <a-box position="-6 0.3 -6" width="0.18" height="0.65" depth="0.18" material="color: #D84315"></a-box>
                <a-box position="6 0.3 -6" width="0.18" height="0.65" depth="0.18" material="color: #D84315"></a-box>
                <a-box position="-6 0.3 6" width="0.18" height="0.65" depth="0.18" material="color: #D84315"></a-box>

                <a-box position="0 0.3 -6" width="0.18" height="0.65" depth="0.18" material="color: #D84315"></a-box>
                <a-box position="-6 0.3 0" width="0.18" height="0.65" depth="0.18" material="color: #D84315"></a-box>

                <a-box position="0 0.18 -6" width="12" height="0.08" depth="0.05" material="color: #D84315"></a-box>
                <a-box position="0 0.45 -6" width="12" height="0.08" depth="0.05" material="color: #D84315"></a-box>

                <a-box position="0 0.18 6" width="12" height="0.08" depth="0.05" material="color: #D84315"></a-box>
                <a-box position="0 0.45 6" width="12" height="0.08" depth="0.05" material="color: #D84315"></a-box>

                <a-box position="-6 0.18 0" width="0.05" height="0.08" depth="12" material="color: #D84315"></a-box>
                <a-box position="-6 0.45 0" width="0.05" height="0.08" depth="12" material="color: #D84315"></a-box>

                <a-box position="6 0.18 0" width="0.05" height="0.08" depth="12" material="color: #D84315"></a-box>
                <a-box position="6 0.45 0" width="0.05" height="0.08" depth="12" material="color: #D84315"></a-box>
            </a-entity>

            <!-- PERNO CENTRALE A CONO -->
            <a-cone position="0 0.6 0" radius-bottom="0.3" radius-top="0.05" height="1.2" color="#FFCC00"></a-cone>

            <!-- SILOS A DESTRA DEL DIORAMA (X=5.2, Z=0) -->
            <a-entity id="silo-station" position="5.2 0 0">
                <a-cylinder position="0 0.2 0" radius="0.5" height="0.4" material="color: #37474F; roughness: 0.4"></a-cylinder>
                <a-cylinder position="0 1.25 0" radius="0.32" height="1.7" material="color: #E0F7FA; opacity: 0.35; transparent: true; roughness: 0.1; side: double"></a-cylinder>
                <a-entity id="silo-stack" position="0 0.4 0"></a-entity>
            </a-entity>

            <!-- PIATTAFORMA DI ATTERRAGGIO A SUD (ORE 6 - UNDO PLATFORM) -->
            <a-entity id="south-station" position="0 0 4.5">
                <a-cylinder position="0 0.2 0" radius="0.5" height="0.4" material="color: #FFEB3B; roughness: 0.4"></a-cylinder>
                <a-text value="UNDO LANDING" position="0 0.45 0" rotation="-90 0 0" align="center" width="2.5" color="#000"></a-text>
                
                <!-- Ologramma Indicatore Sequenza Target -->
                <a-entity id="target-display" position="0 0.4 0"></a-entity>
            </a-entity>

            <!-- 5 SFERE COLORATE LUNGO IL PERCORSO -->
            <a-sphere id="sphere-1" position="0 0.8 -4.5" radius="0.35" material="color: #E53935; opacity: 0.95; roughness: 0.2"></a-sphere>
            <a-sphere id="sphere-2" position="3.89 1.4 -2.25" radius="0.35" material="color: #4CAF50; opacity: 0.95; roughness: 0.2"></a-sphere>
            <a-sphere id="sphere-3" position="3.89 2.1 2.25" radius="0.35" material="color: #1E88E5; opacity: 0.95; roughness: 0.2"></a-sphere>
            <a-sphere id="sphere-4" position="-3.89 1.1 2.25" radius="0.35" material="color: #8E24AA; opacity: 0.95; roughness: 0.2"></a-sphere>
            <a-sphere id="sphere-5" position="-3.89 2.5 -2.25" radius="0.35" material="color: #FB8C00; opacity: 0.95; roughness: 0.2"></a-sphere>

            <!-- VERTIBIRD -->
            <a-entity id="vertibird" position="0 1.1 0" vertibird-flight>
                
                <!-- Asta Meccanica -->
                <a-box id="rod" position="2.25 0 0" width="4.5" height="0.02" depth="0.02" color="#FFCC00"></a-box>
                
                <!-- Wrapper Elicottero -->
                <a-entity id="heli-wrapper" position="4.5 0 0">
                    <a-entity id="heli-yaw" rotation="0 90 0">
                        <a-entity id="heli-pitch" rotation="0 0 0">
                            
                            <!-- Cabina Principale Accorciata -->
                            <a-box position="0 0 0" width="0.55" height="0.42" depth="0.45" material="color: #D32F2F; roughness: 0.3"></a-box>

                            <!-- Parabrezza a Sfera Sporgente per Metà -->
                            <a-sphere position="0.275 0 0" radius="0.22" material="color: #4FC3F7; opacity: 0.6; roughness: 0.1"></a-sphere>

                            <!-- Lampeggiante sulla Cabina -->
                            <a-entity id="beacon-light" position="0 0.23 0">
                                <a-cylinder radius="0.04" height="0.03" material="color: #555; metalness: 0.8"></a-cylinder>
                                <a-cylinder position="0 0.035 0" radius="0.03" height="0.04" material="color: #FF1744; emissive: #FF1744; emissiveIntensity: 0.6"></a-cylinder>
                            </a-entity>

                            <!-- Trave di Coda -->
                            <a-box position="-0.75 0.05 0" width="1.1" height="0.14" depth="0.2" material="color: #D32F2F"></a-box>

                            <!-- Deriva verticale (Timone) -->
                            <a-triangle vertex-a="0 0.3 0" vertex-b="-0.15 0 0" vertex-c="0.15 0 0" position="-1.3 0.25 0" rotation="0 0 -90" material="color: #D32F2F; side: double"></a-triangle>

                            <!-- CARRELLO A RUOTE VERDI PARALLELE -->
                            <a-entity id="wheels-landing-gear">
                                <a-cylinder position="0.05 -0.24 -0.18" radius="0.015" height="0.16" material="color: #333"></a-cylinder>
                                <a-cylinder position="0.05 -0.31 -0.21" radius="0.08" height="0.04" rotation="90 0 0" material="color: #2E7D32"></a-cylinder>
                                
                                <a-cylinder position="0.05 -0.24 0.18" radius="0.015" height="0.16" material="color: #333"></a-cylinder>
                                <a-cylinder position="0.05 -0.31 0.21" radius="0.08" height="0.04" rotation="90 0 0" material="color: #2E7D32"></a-cylinder>
                            </a-entity>

                            <!-- Rotore Principale -->
                            <a-entity position="0 0.24 0">
                                <a-cylinder position="0 0.08 0" radius="0.035" height="0.15" material="color: #D32F2F"></a-cylinder>
                                <a-sphere position="0 0.16 0" radius="0.07" material="color: #FFCC00"></a-sphere>
                                <a-box id="main-rotor" position="0 0.19 0" width="2.8" height="0.012" depth="0.1" color="#FFEB3B"></a-box>
                            </a-entity>

                        </a-entity>
                    </a-entity>
                </a-entity>
            </a-entity>

            <!-- PANNELLO MENÙ IN FORMATO VERTICALE 9:16 -->
            <a-entity id="menu-panel" position="-10.5 3.5 0" rotation="0 30 0" visible="true">
                <a-plane width="3.6" height="6.4" material="shader: flat; src: #menu-bg"></a-plane>

                <!-- RIGA 1: SPEED -->
                <a-text value="Speed" position="-1.5 -0.3 0.05" align="left" width="5.5" color="#000000"></a-text>
                <a-plane id="btn-speed-dec" class="clickable" position="-0.3 -0.3 0.05" width="0.4" height="0.4" color="#D32F2F">
                    <a-text value="-" align="center" width="8" color="#FFF"></a-text>
                </a-plane>
                <a-text id="menu-speed-val" value="90 deg/s" position="0.6 -0.3 0.05" align="center" width="4.5" color="#000000"></a-text>
                <a-plane id="btn-speed-inc" class="clickable" position="1.35 -0.3 0.05" width="0.4" height="0.4" color="#388E3C">
                    <a-text value="+" align="center" width="8" color="#FFF"></a-text>
                </a-plane>

                <!-- RIGA 2: WOBBLING -->
                <a-text value="Wobbling" position="-1.5 -1.0 0.05" align="left" width="5.5" color="#000000"></a-text>
                <a-plane id="btn-wind-dec" class="clickable" position="-0.3 -1.0 0.05" width="0.4" height="0.4" color="#D32F2F">
                    <a-text value="-" align="center" width="8" color="#FFF"></a-text>
                </a-plane>
                <a-text id="menu-wind-val" value="0" position="0.6 -1.0 0.05" align="center" width="4.5" color="#000000"></a-text>
                <a-plane id="btn-wind-inc" class="clickable" position="1.35 -1.0 0.05" width="0.4" height="0.4" color="#388E3C">
                    <a-text value="+" align="center" width="8" color="#FFF"></a-text>
                </a-plane>

                <!-- RIGA 3: INERTIA -->
                <a-text value="Inertia" position="-1.5 -1.7 0.05" align="left" width="5.5" color="#000000"></a-text>
                <a-plane id="btn-inertia-dec" class="clickable" position="-0.3 -1.7 0.05" width="0.4" height="0.4" color="#D32F2F">
                    <a-text value="-" align="center" width="8" color="#FFF"></a-text>
                </a-plane>
                <a-text id="menu-inertia-val" value="20" position="0.6 -1.7 0.05" align="center" width="4.5" color="#000000"></a-text>
                <a-plane id="btn-inertia-inc" class="clickable" position="1.35 -1.7 0.05" width="0.4" height="0.4" color="#388E3C">
                    <a-text value="+" align="center" width="8" color="#FFF"></a-text>
                </a-plane>

                <!-- INDICATORE VERSIONE IN FONDO AL MENÙ -->
                <a-text id="menu-version-val" value="v2.4.0" position="0 -2.8 0.05" align="center" width="3.2" color="#000000"></a-text>
            </a-entity>

        </a-entity> <!-- /world-root -->

        <!-- Camera e Giocatore -->
        <a-entity id="rig" position="0 0 0">
            <a-camera position="0 1.5 0"></a-camera>
            <a-entity id="right-hand" oculus-touch-controls="hand: right" raycaster="objects: .clickable" laser-controls="hand: right"></a-entity>
            <a-entity id="left-hand" oculus-touch-controls="hand: left"></a-entity>
        </a-entity>
    </a-scene>
</body>
</html>
