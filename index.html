<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Quest 3 Direct Gamepad Diagnostic</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script>
        AFRAME.register-component('direct-gamepad-debug', {
            init: function () {
                this.debugText = document.querySelector('#debug-text');
                this.connectedInfo = "Nessun controller rilevato";

                // Ascoltiamo anche gli eventi di connessione nativi del browser
                window.addEventListener("gamepadconnected", (e) => {
                    this.connectedInfo = "Connesso: " + e.gamepad.id;
                });
                window.addEventListener("gamepaddisconnected", (e) => {
                    this.connectedInfo = "Disconnesso: " + e.gamepad.id;
                });
            },
            tick: function () {
                // Polling diretto della Gamepad API del browser (funziona anche in XR sul Quest Browser)
                let gamepads = navigator.getGamepads ? navigator.getGamepads() : [];
                let activeGp = null;
                let output = "=== DIAGNOSTICA GAMEPAD API ===\n\n";
                output += "Info HW: " + this.connectedInfo + "\n\n";

                for (let i = 0; i < gamepads.length; i++) {
                    let gp = gamepads[i];
                    if (gp && gp.connected) {
                        // Cerchiamo il controller destro o il primo disponibile
                        let idLower = (gp.id || "").toLowerCase();
                        if (idLower.includes('right') || idLower.includes('oculus') || idLower.includes('meta') || gp.hand === 'right' || i === 0) {
                            activeGp = gp;
                            break;
                        }
                    }
                }

                if (activeGp) {
                    let triggerVal = (activeGp.buttons && activeGp.buttons[0]) ? activeGp.buttons[0].value.toFixed(2) : "N/D";
                    let triggerPressed = (activeGp.buttons && activeGp.buttons[0]) ? activeGp.buttons[0].pressed : false;
                    
                    let stickX = (activeGp.axes && activeGp.axes.length > 2) ? activeGp.axes[2].toFixed(2) : ((activeGp.axes && activeGp.axes.length > 0) ? activeGp.axes[0].toFixed(2) : "N/D");
                    let stickY = (activeGp.axes && activeGp.axes.length > 3) ? activeGp.axes[3].toFixed(2) : ((activeGp.axes && activeGp.axes.length > 1) ? activeGp.axes[1].toFixed(1) : "N/D");

                    output += "Controller ID: " + activeGp.id.substring(0, 22) + "\n";
                    output += "N. Pulsanti: " + activeGp.buttons.length + " | N. Assi: " + activeGp.axes.length + "\n";
                    output += "----------------------------------\n";
                    output += "Grilletto (Trigger): " + triggerVal + (triggerPressed ? " [PREMUTO]" : "") + "\n";
                    output += "Thumbstick X: " + stickX + "\n";
                    output += "Thumbstick Y: " + stickY + "\n";
                } else {
                    output += "Nessun gamepad attivo rilevato.\nMuovi la levetta o premi un tasto\ndel controller destro per attivarlo.";
                }

                if (this.debugText) {
                    this.debugText.setAttribute('value', output);
                }
            }
        });
    </script>
</head>
<body>
    <a-scene xr-mode-ui="enabled: true" direct-gamepad-debug>
        <a-light type="ambient" color="#FFF" intensity="1"></a-light>

        <!-- Sfondo scuro -->
        <a-plane position="0 0 -5" width="20" height="20" color="#111"></a-plane>

        <!-- Pannello HUD fluttuante davanti agli occhi -->
        <a-entity position="0 1.6 -1.8">
            <a-plane width="2.6" height="1.4" color="#000000" opacity="0.9" material="shader: flat"></a-plane>
            <a-text id="debug-text" value="In attesa di dati dal gamepad..." position="0 0 0.01" align="center" color="#00FF66" width="3.2" font="monoid"></a-text>
        </a-entity>

        <a-camera></a-camera>
    </a-scene>
</body>
</html>
