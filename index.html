<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>VR Vertibird Simulator - Left Controller Throttle & Menu</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script>
        AFRAME.registerComponent('vertibird-flight', {
            init: function () {
                this.angle = 0;        
                this.heliY = 0.31;     
                this.radius = 4.5;     
                
                this.currentThrottle = 0;
                this.currentStickY = 0;

                // Parametri regolabili da Menu
                this.speedMultiplier = 90.0; // Velocità moto circolare
                this.windAmplitude = 1.0;    // Moltiplicatore vento / oscillazioni

                this.rotorAngle = 0;
                this.tailRotorAngle = 0;

                // Gestione World Root, Scaling e Grab
                this.worldRoot = document.querySelector('#world-root');
                this.currentScale = 1.0; 
                this.isDragging = false;
                
                this.initialControllerMatrixInv = new THREE.Matrix4();
                this.initialWorldMatrix = new THREE.Matrix4();
                
                this.heliWrapperEl = document.querySelector('#heli-wrapper');
                this.heliPitchEl = document.querySelector('#heli-pitch');
                this.rotorEl = document.querySelector('#main-rotor');
                this.tailRotorEl = document.querySelector('#tail-rotor');
                this.rightHandEl = document.querySelector('#right-hand');
                this.leftHandEl = document.querySelector('#left-hand');

                // Elementi Menu
                this.menuPanel = document.querySelector('#menu-panel');
                this.speedText = document.querySelector('#menu-speed-val');
                this.windText = document.querySelector('#menu-wind-val');
                this.menuVisible = false;

                // --- SISTEMA AUDIO ---
                this.audioCtx = null;
                this.oscillator = null;
                this.gainNode = null;
                this.audioInitialized = false;

                this.initAudio = () => {
                    if (this.audioInitialized) {
                        if (this.audioCtx && this.audioCtx.state === 'suspended') {
                            this.audioCtx.resume();
                        }
                        return;
                    }
                    try {
                        window.AudioContext = window.AudioContext || window.webkitAudioContext;
                        this.audioCtx = new AudioContext();
                        
                        this.oscillator = this.audioCtx.createOscillator();
                        this.oscillator.type = 'sawtooth';
                        this.oscillator.frequency.setValueAtTime(30, this.audioCtx.currentTime);

                        this.gainNode = this.audioCtx.createGain();
                        this.gainNode.gain.setValueAtTime(0.0, this.audioCtx.currentTime);

                        this.oscillator.connect(this.gainNode);
                        this.gainNode.connect(this.audioCtx.destination);
                        this.oscillator.start();
                        
                        this.audioInitialized = true;
                    } catch (e) {}
                };

                window.addEventListener('click', this.initAudio);
                window.addEventListener('touchstart', this.initAudio);

                // --- SCALING FINE ---
                const applyScale = (delta) => {
                    this.currentScale = Math.min(3.0, Math.max(0.02, this.currentScale + delta));
                    if (this.worldRoot && this.worldRoot.object3D) {
                        this.worldRoot.object3D.scale.set(this.currentScale, this.currentScale, this.currentScale);
                        this.worldRoot.object3D.updateMatrixWorld(true);
                    }
                };

                this.rightHandEl.addEventListener('abuttondown', () => applyScale(-0.04));
                this.rightHandEl.addEventListener('bbuttondown', () => applyScale(0.04));

                // --- APERTURA / CHIUSURA MENU TASTO SINISTRO (Menu / X / Y) ---
                const toggleMenu = () => {
                    this.menuVisible = !this.menuVisible;
                    if (this.menuPanel) {
                        this.menuPanel.setAttribute('visible', this.menuVisible);
                    }
                };

                this.leftHandEl.addEventListener('menubuttondown', toggleMenu);
                this.leftHandEl.addEventListener('xbuttondown', toggleMenu);
                this.leftHandEl.addEventListener('ybuttondown', toggleMenu);

                // --- LOGICA PULSANTI MENU ---
                this.updateMenuUI = () => {
                    if (this.speedText) this.speedText.setAttribute('value', `${this.speedMultiplier.toFixed(0)} deg/s`);
                    if (this.windText) this.windText.setAttribute('value', `${(this.windAmplitude * 100).toFixed(0)}%`);
                };

                let btnSpeedDec = document.querySelector('#btn-speed-dec');
                let btnSpeedInc = document.querySelector('#btn-speed-inc');
                let btnWindDec = document.querySelector('#btn-wind-dec');
                let btnWindInc = document.querySelector('#btn-wind-inc');

                if (btnSpeedDec) btnSpeedDec.addEventListener('click', () => {
                    this.speedMultiplier = Math.max(10.0, this.speedMultiplier - 15.0);
                    this.updateMenuUI();
                });
                if (btnSpeedInc) btnSpeedInc.addEventListener('click', () => {
                    this.speedMultiplier = Math.min(300.0, this.speedMultiplier + 15.0);
                    this.updateMenuUI();
                });
                if (btnWindDec) btnWindDec.addEventListener('click', () => {
                    this.windAmplitude = Math.max(0.0, this.windAmplitude - 0.25);
                    this.updateMenuUI();
                });
                if (btnWindInc) btnWindInc.addEventListener('click', () => {
                    this.windAmplitude = Math.min(3.0, this.windAmplitude + 0.25);
                    this.updateMenuUI();
                });

                this.updateMenuUI();
            },
            tick: function (time, delta) {
                let dt = delta / 1000;
                let t = time / 1000; 
                
                let leftTrigger = 0;
                let rightGrip = 0;
                let rightStickY = 0;

                // --- 1. LETTURA INPUT SEPARATI (Sinistra = Gas, Destra = Stick & Grip) ---
                let xrSession = this.el.sceneEl.renderer ? this.el.sceneEl.renderer.xr.getSession() : null;
                if (xrSession && xrSession.inputSources) {
                    for (let source of xrSession.inputSources) {
                        if (source.handedness === 'left' && source.gamepad) {
                            leftTrigger = source.gamepad.buttons[0] ? source.gamepad.buttons[0].value : 0;
                        }
                        if (source.handedness === 'right' && source.gamepad) {
                            rightGrip = source.gamepad.buttons[1] ? (source.gamepad.buttons[1].value || (source.gamepad.buttons[1].pressed ? 1 : 0)) : 0;
                            rightStickY = source.gamepad.axes.length >= 4 ? source.gamepad.axes[3] : (source.gamepad.axes.length >= 2 ? source.gamepad.axes[1] : 0);
                        }
                    }
                } else {
                    let gamepads = navigator.getGamepads ? navigator.getGamepads() : [];
                    for (let g of gamepads) {
                        if (g && g.connected) {
                            if (g.hand === 'left' || (g.id && g.id.toLowerCase().includes('left'))) {
                                leftTrigger = g.buttons[0] ? g.buttons[0].value : 0;
                            }
                            if (g.hand === 'right' || (g.id && g.id.toLowerCase().includes('right'))) {
                                rightGrip = g.buttons[1] ? (g.buttons[1].value || (g.buttons[1].pressed ? 1 : 0)) : 0;
                                rightStickY = g.axes.length >= 4 ? g.axes[3] : (g.axes.length >= 2 ? g.axes[1] : 0);
                            }
                        }
                    }
                }

                if (leftTrigger > 0.02) {
                    this.initAudio();
                }

                if (Math.abs(rightStickY) < 0.15) rightStickY = 0;
                if (leftTrigger < 0.02) leftTrigger = 0;

                // --- 2. LOGICA GRAB DEL DIORAMA (GRIP DESTRO) ---
                if (this.rightHandEl && this.rightHandEl.object3D && this.worldRoot && this.worldRoot.object3D) {
                    let handObj = this.rightHandEl.object3D;
                    
                    if (rightGrip > 0.5) {
                        handObj.updateMatrixWorld(true);
                        this.worldRoot.object3D.updateMatrixWorld(true);

                        if (!this.isDragging) {
                            this.isDragging = true;
                            this.initialControllerMatrixInv.copy(handObj.matrixWorld).invert();
                            this.initialWorldMatrix.copy(this.worldRoot.object3D.matrixWorld);
                        } else {
                            let currentControllerMatrix = handObj.matrixWorld;
                            let deltaMatrix = currentControllerMatrix.clone().multiply(this.initialControllerMatrixInv);
                            let targetMatrix = deltaMatrix.clone().multiply(this.initialWorldMatrix);

                            let p = new THREE.Vector3();
                            let q = new THREE.Quaternion();
                            let s = new THREE.Vector3();
                            targetMatrix.decompose(p, q, s);

                            this.worldRoot.object3D.position.copy(p);
                            this.worldRoot.object3D.quaternion.copy(q);
                            this.worldRoot.object3D.updateMatrixWorld(true);
                        }
                    } else {
                        this.isDragging = false;
                    }
                }

                // --- 3. INERZIA ---
                this.currentThrottle += (leftTrigger - this.currentThrottle) * dt * 5.0;
                this.currentStickY += (rightStickY - this.currentStickY) * dt * 6.0;

                // --- 4. TURBOLENZE (Regolate da windAmplitude) ---
                let heightNoise = 0;
                let pitchNoise = 0;
                
                if (this.currentThrottle > 0.05) {
                    heightNoise = (((Math.sin(t * 2.3) * 0.03) + (Math.sin(t * 5.1) * 0.015)) * this.currentThrottle) * this.windAmplitude;
                    pitchNoise = (((Math.sin(t * 1.8) * 1.2) + (Math.cos(t * 4.4) * 0.8)) * this.currentThrottle) * this.windAmplitude;
                }

                // --- 5. FISICA DELL'ALTEZZA ---
                let takeoffThreshold = 0.35; 
                let effectiveThrottle = 0;
                
                if (this.currentThrottle > takeoffThreshold) {
                    effectiveThrottle = (this.currentThrottle - takeoffThreshold) / (1.0 - takeoffThreshold);
                }

                let targetHeliY = 0.31 + (effectiveThrottle * 2.5) + heightNoise;
                this.heliY += (targetHeliY - this.heliY) * dt * 4.0;
                if (this.heliY < 0.31) this.heliY = 0.31;

                let hingeAngleRad = Math.asin((this.heliY - 1.1) / this.radius);
                let hingeAngleDeg = hingeAngleRad * (180 / Math.PI);

                // --- 6. ASSETTO DEL MUSO ---
                let speedFactor = this.currentStickY; 
                let pitchAngle = (speedFactor * 15.0) + pitchNoise; 
                
                if (this.heliWrapperEl) {
                    this.heliWrapperEl.setAttribute('rotation', { x: 0, y: 0, z: -hingeAngleDeg });
                }

                if (this.heliPitchEl) {
                    this.heliPitchEl.setAttribute('rotation', { x: 0, y: 0, z: pitchAngle });
                }

                // --- 7. MOTO CIRCOLARE (Regolato da speedMultiplier) ---
                if (this.heliY > 0.315) {
                    let angularSpeed = -speedFactor * this.currentThrottle * this.speedMultiplier; 
                    this.angle += angularSpeed * dt;
                }

                this.el.setAttribute('rotation', { x: 0, y: this.angle, z: hingeAngleDeg });

                // --- 8. ROTAZIONE PALE ---
                if (this.currentThrottle > 0.01) {
                    let rotSpeed = this.currentThrottle * 4000; 
                    this.rotorAngle += rotSpeed * dt;
                    this.tailRotorAngle += (rotSpeed * 2.5) * dt;

                    if (this.rotorEl) {
                        this.rotorEl.setAttribute('rotation', `0 ${this.rotorAngle % 360} 0`);
                    }
                    if (this.tailRotorEl) {
                        this.tailRotorEl.setAttribute('rotation', `${this.tailRotorAngle % 360} 0 0`);
                    }
                }

                // --- 9. AUDIO ---
                if (this.audioInitialized && this.oscillator && this.gainNode && this.audioCtx) {
                    let targetFreq = 30 + (this.currentThrottle * 70);
                    let targetVolume = this.currentThrottle > 0.01 ? 0.18 : 0.0;
                    this.oscillator.frequency.setTargetAtTime(targetFreq, this.audioCtx.currentTime, 0.1);
                    this.gainNode.gain.setTargetAtTime(targetVolume, this.audioCtx.currentTime, 0.1);
                }
            }
        });
    </script>
    <style>
        #ar-button-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 9999;
        }
        .custom-ar-btn {
            background-color: #2e7d32;
            color: white;
            border: 2px solid #4caf50;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: background 0.2s;
        }
        .custom-ar-btn:hover {
            background-color: #388e3c;
        }
    </style>
</head>
<body>
    <!-- Pulsante HTML per avviare la sessione Immersive AR (Passthrough) -->
    <div id="ar-button-container">
        <button class="custom-ar-btn" onclick="document.querySelector('a-scene').enterAR()">ENTRA IN AR (PASSTHROUGH)</button>
    </div>

    <a-scene xr-mode-ui="enabled: true">
        <a-light type="ambient" color="#FFF" intensity="0.8"></a-light>
        <a-light type="directional" color="#FFF" intensity="0.8" position="-1 3 1"></a-light>

        <!-- CONTENITORE GLOBALE DEL DIORAMA -->
        <a-entity id="world-root" position="0 -0.3 -1.2" rotation="0 0 0" scale="1 1 1">
            
            <!-- Base con texture JPG stretchata -->
            <a-box position="0 -0.05 0" width="12" height="0.1" depth="12" material="src: url(terreno.jpg); roughness: 0.8"></a-box>
            
            <!-- Perno Centrale a Cono -->
            <a-cone position="0 0.6 0" radius-bottom="0.3" radius-top="0.05" height="1.2" color="#FFCC00"></a-cone>

            <!-- VERTIBIRD -->
            <a-entity id="vertibird" position="0 1.1 0" vertibird-flight>
                
                <!-- Asta Meccanica -->
                <a-box id="rod" position="2.25 0 0" width="4.5" height="0.02" depth="0.02" color="#FFCC00"></a-box>
                
                <!-- Wrapper Elicottero -->
                <a-entity id="heli-wrapper" position="4.5 0 0">
                    <a-entity id="heli-yaw" rotation="0 90 0">
                        <a-entity id="heli-pitch" rotation="0 0 0">
                            
                            <!-- Cabina Principale -->
                            <a-box position="0 0 0" width="0.85" height="0.42" depth="0.45" material="color: #D32F2F; roughness: 0.3"></a-box>

                            <!-- Parabrezza -->
                            <a-sphere position="0.3 0 0" radius="0.22" material="color: #4FC3F7; opacity: 0.6; roughness: 0.1"></a-sphere>

                            <!-- Trave di Coda -->
                            <a-box position="-0.9 0.05 0" width="1.4" height="0.14" depth="0.2" material="color: #D32F2F"></a-box>

                            <!-- Deriva verticale -->
                            <a-triangle vertex-a="0 0.3 0" vertex-b="-0.15 0 0" vertex-c="0.15 0 0" position="-1.55 0.25 0" rotation="0 0 -90" material="color: #D32F2F; side: double"></a-triangle>

                            <!-- Rotore di Coda -->
                            <a-entity position="-1.65 0.15 0" rotation="90 0 0">
                                <a-cylinder radius="0.06" height="0.02" material="color: #FFCC00"></a-cylinder>
                                <a-box id="tail-rotor" width="0.45" height="0.01" depth="0.07" color="#FFEB3B"></a-box>
                            </a-entity>

                            <!-- Pattini e Montanti -->
                            <a-box position="0.05 -0.31 -0.22" width="0.75" height="0.025" depth="0.035" material="color: #388E3C"></a-box>
                            <a-box position="0.05 -0.31 0.22" width="0.75" height="0.025" depth="0.035" material="color: #388E3C"></a-box>
                            <a-box position="0.18 -0.16 -0.22" width="0.025" height="0.28" depth="0.02" rotation="0 0 15" material="color: #388E3C"></a-box>
                            <a-box position="-0.12 -0.16 -0.22" width="0.025" height="0.28" depth="0.02" rotation="0 0 -15" material="color: #388E3C"></a-box>
                            <a-box position="0.18 -0.16 0.22" width="0.025" height="0.28" depth="0.02" rotation="0 0 15" material="color: #388E3C"></a-box>
                            <a-box position="-0.12 -0.16 0.22" width="0.025" height="0.28" depth="0.02" rotation="0 0 -15" material="color: #388E3C"></a-box>

                            <!-- Rotore Principale -->
                            <a-entity position="0 0.24 0">
                                <a-cylinder position="0 0.08 0" radius="0.035" height="0.15" material="color: #D32F2F"></a-cylinder>
                                <a-sphere position="0 0.16 0" radius="0.07" material="color: #FFCC00"></a-sphere>
                                <a-box id="main-rotor" position="0 0.19 0" width="2.8" height="0.012" depth="0.1" color="#FFEB3B"></a-box>
                            </a-entity>

                        </a-entity>
                    </a-entity>
                </a-entity>
            </a-entity>

        </a-entity> <!-- /world-root -->

        <!-- Camera e Giocatore -->
        <a-entity id="rig" position="0 0 0">
            <a-camera position="0 1.5 0">
                <!-- PANNELLO MENU 3D FLUTTUANTE DAVANTI ALLA CAMERA -->
                <a-entity id="menu-panel" position="0 0 -1.2" visible="false">
                    <a-plane width="1.1" height="0.8" color="#1E1E1E" material="opacity: 0.9; transparent: true"></a-plane>
                    
                    <a-text value="IMPOSTAZIONI VOLO" position="0 0.3 0.01" align="center" width="1.8" color="#FFCC00"></a-text>

                    <!-- Controllo Velocità -->
                    <a-text value="Velocita Moto:" position="-0.45 0.12 0.01" width="1.3" color="#FFF"></a-text>
                    <a-plane id="btn-speed-dec" class="clickable" position="0.05 0.12 0.01" width="0.1" height="0.1" color="#D32F2F">
                        <a-text value="-" align="center" width="2" color="#FFF"></a-text>
                    </a-plane>
                    <a-text id="menu-speed-val" value="90 deg/s" position="0.25 0.12 0.01" align="center" width="1.2" color="#00FF66"></a-text>
                    <a-plane id="btn-speed-inc" class="clickable" position="0.43 0.12 0.01" width="0.1" height="0.1" color="#388E3C">
                        <a-text value="+" align="center" width="2" color="#FFF"></a-text>
                    </a-plane>

                    <!-- Controllo Vento -->
                    <a-text value="Ampiezza Vento:" position="-0.45 -0.08 0.01" width="1.3" color="#FFF"></a-text>
                    <a-plane id="btn-wind-dec" class="clickable" position="0.05 -0.08 0.01" width="0.1" height="0.1" color="#D32F2F">
                        <a-text value="-" align="center" width="2" color="#FFF"></a-text>
                    </a-plane>
                    <a-text id="menu-wind-val" value="100%" position="0.25 -0.08 0.01" align="center" width="1.2" color="#00FF66"></a-text>
                    <a-plane id="btn-wind-inc" class="clickable" position="0.43 -0.08 0.01" width="0.1" height="0.1" color="#388E3C">
                        <a-text value="+" align="center" width="2" color="#FFF"></a-text>
                    </a-plane>

                    <a-text value="Premi il tasto Menu Sinistro per Chiudere" position="0 -0.3 0.01" align="center" width="1.0" color="#AAA"></a-text>
                </a-entity>
            </a-camera>
            
            <!-- Controller Destro con Puntatore Laser abilitato per il Menu -->
            <a-entity id="right-hand" oculus-touch-controls="hand: right" raycaster="objects: .clickable" laser-controls="hand: right"></a-entity>
            
            <!-- Controller Sinistro per Gas e Menu -->
            <a-entity id="left-hand" oculus-touch-controls="hand: left"></a-entity>
        </a-entity>
    </a-scene>
</body>
</html>
