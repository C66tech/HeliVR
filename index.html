<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>VR Vertibird - Simple Test</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script>
        // Componente di test ultra-semplice
        AFRAME.register-component('vertibird-flight', {
            init: function () {
                this.angle = 0;
                this.height = 1.0;
                this.radius = 3.0;
                this.throttle = 0;
                
                this.rightController = document.querySelector('#right-hand');
                this.statusText = document.querySelector('#status-text');
                
                // Eventi standard A-Frame per i controller Oculus
                if (this.rightController) {
                    this.rightController.addEventListener('triggerdown', () => {
                        this.throttle = 1.0;
                        if(this.statusText) this.statusText.setAttribute('value', 'GRILLETTO PREMUTO!');
                    });
                    this.rightController.addEventListener('triggerup', () => {
                        this.throttle = 0.0;
                        if(this.statusText) this.statusText.setAttribute('value', 'Pronto. Premi il grilletto.');
                    });
                }

                this.modelEl = this.el.querySelector('#heli-model');
            },
            tick: function (time, delta) {
                let dt = delta / 1000;

                // Movimento base legato al gas
                this.height += (this.throttle * 2.0 - (this.height - 1.0) * 0.5) * dt;
                this.height = Math.max(0.6, Math.min(this.height, 3.5));

                this.angle += 1.0 * dt;
                let x = Math.cos(this.angle) * this.radius;
                let z = Math.sin(this.angle) * this.radius;
                
                this.el.setAttribute('position', { x: x, y: this.height, z: z });

                let rotationY = -this.angle * (180 / Math.PI) + 180;
                if (this.modelEl) {
                    this.modelEl.setAttribute('rotation', { x: this.throttle * -10, y: rotationY, z: 0 });
                }
            }
        });
    </script>
</head>
<body>
    <a-scene xr-mode-ui="enabled: true">
        <!-- Illuminazione -->
        <a-light type="ambient" color="#FFF" intensity="0.8"></a-light>
        <a-light type="directional" color="#FFF" intensity="0.8" position="-1 3 1"></a-light>

        <!-- Pavimento -->
        <a-box position="0 -0.5 0" width="10" height="1" depth="10" material="color: #333"></a-box>
        
        <!-- Tabellone di testo 3D gigante davanti a te per vedere se carica -->
        <a-entity position="0 1.5 -2">
            <a-plane width="3" height="1" color="#111"></a-plane>
            <a-text id="status-text" value="In attesa di interazione...\nPremi il grilletto destro." position="0 0 0.01" align="center" color="#00FF00" width="4"></a-text>
        </a-entity>

        <!-- Perno centrale -->
        <a-cylinder position="0 0 0" radius="0.2" height="1.5" color="#FFCC00"></a-cylinder>

        <!-- Elicottero -->
        <a-entity id="vertibird" vertibird-flight>
            <a-entity position="0 0.75 0">
                <a-box position="-1.5 0 0" width="3.0" height="0.03" depth="0.03" color="#FFCC00"></a-box>
                
                <a-entity id="heli-model" position="-3.0 0 0" rotation="0 90 0">
                    <!-- Corpo elicottero base -->
                    <a-box position="0 0 0" width="0.85" height="0.42" depth="0.45" material="color: #D32F2F"></a-box>
                    <a-sphere position="0.32 0 0" radius="0.22" material="color: #00E5FF; opacity: 0.65"></a-sphere>
                    <a-cylinder position="-0.75 0.05 0" radius="0.055" height="1.0" rotation="0 0 90" material="color: #B71C1C"></a-cylinder>
                    
                    <!-- Elica che gira -->
                    <a-entity position="0 0.24 0">
                        <a-box width="2.6" height="0.012" depth="0.1" material="color: #111"
                               animation="property: rotation; to: 0 360 0; loop: true; dur: 200; easing: linear">
                        </a-box>
                    </a-entity>
                </a-entity>
            </a-entity>
        </a-entity>

        <!-- Camera e Controller Quest 3 -->
        <a-entity id="rig" position="0 1.6 3">
            <a-camera></a-camera>
            <a-entity id="right-hand" oculus-touch-controls="hand: right"></a-entity>
            <a-entity id="left-hand" oculus-touch-controls="hand: left"></a-entity>
        </a-entity>
    </a-scene>
</body>
</html>
