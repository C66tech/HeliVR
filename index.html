<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <title>Whirlybird VR - V25.16.0</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script>
        // DEFINIZIONE COLORI E ALTEZZE PIATTAFORME
        const COLOR_DEFS = [
            { name: 'blue', hex: '#1976D2', height: 0.5 },
            { name: 'purple', hex: '#9C27B0', height: 0.8 },
            { name: 'orange', hex: '#FF9800', height: 0.3 },
            { name: 'green', hex: '#4CAF50', height: 0.4 },
            { name: 'red', hex: '#E53935', height: 0.6 }
        ];

        // COMPONENTE PER FLIPPARE UV ORIZZONTALMENTE SULLE MESH
        AFRAME.registerComponent('flip-uv-x', {
            init: function () {
                this.el.addEventListener('materialtextureloaded', () => {
                    const mesh = this.el.getObject3D('mesh');
                    if (mesh && mesh.material && mesh.material.map) {
                        mesh.material.map.repeat.x = -1;
                        mesh.material.map.wrapS = THREE.RepeatWrapping;
                        mesh.material.map.needsUpdate = true;
                    }
                });
            }
        });

        // FALLBACK TEXTURE
        AFRAME.registerComponent('texture-fallback', {
            init: function () {
                const applyFallback = () => {
                    this.el.setAttribute('material', { src: '', color: '#B0E0E6', transparent: true, opacity: 0.3, roughness: 0.8 });
                };
                this.el.addEventListener('materialtextureerror', applyFallback);
                const srcAttr = this.el.getAttribute('material')?.src;
                if (srcAttr && typeof srcAttr === 'string' && srcAttr.startsWith('#')) {
                    const assetEl = document.querySelector(srcAttr);
                    if (assetEl) assetEl.addEventListener('error', applyFallback);
                }
            }
        });

        // COMPONENTE PER TRASCINARE LO HUD SEPARATAMENTE TRAMITE GRIP DESTRO
        AFRAME.registerComponent('hud-drag', {
            init: function () {
                this.isDragging = false;
                this.rightHandEl = document.querySelector('#right-hand');
                this.dragP = new THREE.Vector3();
                this.dragQ = new THREE.Quaternion();
                this.dragS = new THREE.Vector3();
                this.dragEuler = new THREE.Euler();
                this.initialControllerMatrixInv = new THREE.Matrix4();
                this.initialHudMatrix = new THREE.Matrix4();
            },
            tick: function () {
                let rightGrip = 0;
                let xrSession = this.el.sceneEl.renderer?.xr?.getSession();
                if (xrSession && xrSession.inputSources) {
                    for (let source of xrSession.inputSources) {
                        if (source.handedness === 'right' && source.gamepad) {
                            let gp = source.gamepad;
                            rightGrip = gp.buttons[1] ? (gp.buttons[1].value || (gp.buttons[1].pressed ? 1 : 0)) : 0;
                        }
                    }
                }

                if (this.rightHandEl && this.rightHandEl.object3D) {
                    let handObj = this.rightHandEl.object3D;
                    let hudObj = this.el.object3D;

                    handObj.updateMatrixWorld(true);
                    let handPos = new THREE.Vector3();
                    handObj.getWorldPosition(handPos);

                    let hudPos = new THREE.Vector3();
                    hudObj.getWorldPosition(hudPos);

                    let dist = handPos.distanceTo(hudPos);

                    if (rightGrip > 0.5 && (dist < 1.2 || this.isDragging)) {
                        hudObj.updateMatrixWorld(true);
                        if (!this.isDragging) {
                            this.isDragging = true;
                            this.initialControllerMatrixInv.copy(handObj.matrixWorld).invert();
                            this.initialHudMatrix.copy(hudObj.matrixWorld);
                        } else {
                            let currentControllerMatrix = handObj.matrixWorld;
                            let deltaMatrix = currentControllerMatrix.clone().multiply(this.initialControllerMatrixInv);
                            let targetMatrix = deltaMatrix.clone().multiply(this.initialHudMatrix);

                            targetMatrix.decompose(this.dragP, this.dragQ, this.dragS);
                            this.el.object3D.position.copy(this.dragP);
                            this.el.object3D.quaternion.copy(this.dragQ);
                            this.el.object3D.updateMatrixWorld(true);
                        }
                    } else {
                        this.isDragging = false;
                    }
                }
            }
        });

        // LOGICA DI VOLO E FISICA (WHIRLYBIRD VR)
        AFRAME.registerComponent('vertibird-flight', {
            init: function () {
                this.version = "25.16.0"; 
                this.angle = 0;        
                
                this.minHeliY = 0.75;  
                this.heliY = 0.75;     
                this.radius = 6.48;    
                
                this.currentThrottle = 0;
                this.currentStickY = 0;
                this.angularVelocity = 0; 
                this.speedMultiplier = 180.0; 
                this.wobbleAmplitude = 30; 
                this.inertiaValue = 80;     
                this.rotorAngle = 0;
                this.currentAngularSpeed = 0; 

                this.gameLevel = 1; 

                // Allocazioni vettori
                this.dragP = new THREE.Vector3();
                this.dragQ = new THREE.Quaternion();
                this.dragS = new THREE.Vector3();
                this.dragEuler = new THREE.Euler();
                
                this.hookL = new THREE.Vector3();
                this.objL = new THREE.Vector3();
                this.platL = new THREE.Vector3();
                this.heliL = new THREE.Vector3();

                this.currentVol = 0;
                this.currentWindVol = 0;

                this.worldRoot = document.querySelector('#world-root');
                this.hudDashboard = document.querySelector('#central-dashboard');
                this.mainCameraEl = document.querySelector('#main-camera');
                this.cockpitCameraEl = document.querySelector('#cockpit-camera');
                
                this.heliWrapperEl = document.querySelector('#heli-wrapper');
                this.heliYawEl = document.querySelector('#heli-yaw');
                this.heliPitchEl = document.querySelector('#heli-pitch');
                
                this.rotorEl = document.querySelector('#main-rotor');
                this.rightHandEl = document.querySelector('#right-hand');
                this.leftHandEl = document.querySelector('#left-hand');

                this.hookArea = document.querySelector('#hook-area');
                this.hookMagnet = document.querySelector('#hook-magnet');
                
                this.currentScale = 0.06; 
                this.isDragging = false;
                this.isCockpitActive = false; 

                this.initialControllerMatrixInv = new THREE.Matrix4();
                this.initialWorldMatrix = new THREE.Matrix4();

                this.isAttached = false;
                this.attachedCrate = null;
                this.prevRightTrigger = false;
                this.prevIsYellow = false;

                this.statusTextEl = document.querySelector('#game-status-text');
                this.timerStarted = false;
                this.timerRunning = false;
                this.elapsedTime = 0;
                this.matchedCrates = 0;

                this.speedText = document.querySelector('#menu-speed-val');
                this.windText = document.querySelector('#menu-wind-val');
                this.inertiaText = document.querySelector('#menu-inertia-val');
                this.levelText = document.querySelector('#menu-level-val');
                this.versionText = document.querySelector('#menu-version-val');

                if (this.worldRoot && this.worldRoot.object3D) {
                    this.worldRoot.object3D.scale.set(this.currentScale, this.currentScale, this.currentScale);
                }

                this.audioCtx = null;
                this.oscillator = null;
                this.gainNode = null;
                this.windOsc = null;
                this.windFilter = null;
                this.windGain = null;
                this.audioInitialized = false;

                this.initAudio = () => {
                    if (this.audioInitialized) {
                        if (this.audioCtx && this.audioCtx.state === 'suspended') this.audioCtx.resume();
                        return;
                    }
                    try {
                        window.AudioContext = window.AudioContext || window.webkitAudioContext;
                        this.audioCtx = new AudioContext();
                        
                        // MOTORE VERTIBIRD
                        this.oscillator = this.audioCtx.createOscillator();
                        this.oscillator.type = 'sawtooth';
                        this.oscillator.frequency.value = 30;

                        this.gainNode = this.audioCtx.createGain();
                        this.gainNode.gain.value = 0.0;

                        this.oscillator.connect(this.gainNode);
                        this.gainNode.connect(this.audioCtx.destination);
                        this.oscillator.start();

                        // EFFETTO VENTO
                        this.windOsc = this.audioCtx.createOscillator();
                        this.windOsc.type = 'sawtooth'; 
                        this.windOsc.frequency.value = 250;

                        this.windFilter = this.audioCtx.createBiquadFilter();
                        this.windFilter.type = 'bandpass';
                        this.windFilter.frequency.value = 400;
                        this.windFilter.Q.value = 4.0;

                        this.windGain = this.audioCtx.createGain();
                        this.windGain.gain.value = 0.0;

                        this.windOsc.connect(this.windFilter);
                        this.windFilter.connect(this.windGain);
                        this.windGain.connect(this.audioCtx.destination);
                        this.windOsc.start();

                        this.audioInitialized = true;
                    } catch (e) {}
                };

                // BEEP SINGOLO CON DURATA DI 400 MS
                this.playBeep = (freq = 880, duration = 0.4) => {
                    if (!this.audioCtx) return;
                    if (this.audioCtx.state === 'suspended') this.audioCtx.resume();
                    try {
                        let osc = this.audioCtx.createOscillator();
                        let gain = this.audioCtx.createGain();
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(freq, this.audioCtx.currentTime);
                        gain.gain.setValueAtTime(0.25, this.audioCtx.currentTime);
                        gain.gain.exponentialRampToValueAtTime(0.001, this.audioCtx.currentTime + duration);
                        osc.connect(gain);
                        gain.connect(this.audioCtx.destination);
                        osc.start();
                        osc.stop(this.audioCtx.currentTime + duration);
                    } catch(e) {}
                };

                // ATTIVAZIONE VIBRAZIONE SU CONTROLLER VR (400 MS)
                this.triggerHaptics = (intensity = 0.7, duration = 400) => {
                    let xrSession = this.el.sceneEl.renderer?.xr?.getSession();
                    if (xrSession && xrSession.inputSources) {
                        for (let source of xrSession.inputSources) {
                            if (source.gamepad) {
                                if (source.gamepad.hapticActuators && source.gamepad.hapticActuators.length > 0) {
                                    source.gamepad.hapticActuators[0].pulse(intensity, duration);
                                } else if (source.gamepad.vibrationActuator && source.gamepad.vibrationActuator.pulse) {
                                    source.gamepad.vibrationActuator.pulse({ duration: duration, strongMagnitude: intensity, weakMagnitude: intensity });
                                }
                            }
                        }
                    }
                };

                window.addEventListener('click', this.initAudio);
                window.addEventListener('touchstart', this.initAudio);

                this.toggleCockpit = () => {
                    this.isCockpitActive = !this.isCockpitActive;
                    if (this.isCockpitActive) {
                        this.mainCameraEl.setAttribute('camera', 'active', false);
                        this.cockpitCameraEl.setAttribute('camera', 'active', true);
                    } else {
                        this.cockpitCameraEl.setAttribute('camera', 'active', false);
                        this.mainCameraEl.setAttribute('camera', 'active', true);
                    }
                };

                this.leftHandEl.addEventListener('xbuttondown', this.toggleCockpit);

                const applyScale = (delta) => {
                    if (this.isCockpitActive) return; 
                    this.currentScale = Math.min(3.0, Math.max(0.005, this.currentScale + delta));
                    if (this.worldRoot && this.worldRoot.object3D) {
                        this.worldRoot.object3D.scale.set(this.currentScale, this.currentScale, this.currentScale);
                        this.worldRoot.object3D.updateMatrixWorld(true);
                    }
                };

                this.rightHandEl.addEventListener('abuttondown', () => applyScale(-0.0025));
                this.rightHandEl.addEventListener('bbuttondown', () => applyScale(0.0025));

                // CONFIGURAZIONE DINAMICA LIVELLO
                this.setupLevel = (level) => {
                    let numPlatforms = level + 2;
                    let numCrates = level + 1;

                    if (this.attachedCrate) {
                        this.worldRoot.object3D.add(this.attachedCrate.object3D);
                        this.attachedCrate = null;
                    }

                    const platContainer = document.querySelector('#platforms-container');
                    const cratesContainer = document.querySelector('#crates-container');
                    platContainer.innerHTML = '';
                    cratesContainer.innerHTML = '';

                    this.platforms = [];
                    for (let i = 0; i < numPlatforms; i++) {
                        let pDef = COLOR_DEFS[i];
                        let angle = (i * 2 * Math.PI) / numPlatforms;
                        let dir = { x: Math.cos(angle), z: Math.sin(angle) };

                        let platEl = document.createElement('a-entity');
                        platEl.setAttribute('id', `plat-${i}`);

                        let cyl = document.createElement('a-cylinder');
                        cyl.setAttribute('position', `0 ${pDef.height / 2} 0`);
                        cyl.setAttribute('radius', '0.75');
                        cyl.setAttribute('height', pDef.height);
                        cyl.setAttribute('color', pDef.hex);
                        platEl.appendChild(cyl);

                        let ring = document.createElement('a-ring');
                        ring.setAttribute('position', `0 ${pDef.height + 0.001} 0`);
                        ring.setAttribute('rotation', '-90 0 0');
                        ring.setAttribute('radius-inner', '0.6');
                        ring.setAttribute('radius-outer', '0.72');
                        ring.setAttribute('color', '#FFFFFF');
                        platEl.appendChild(ring);

                        let text = document.createElement('a-text');
                        text.setAttribute('value', 'H');
                        text.setAttribute('position', `0 ${pDef.height + 0.001} 0`);
                        text.setAttribute('rotation', '-90 0 0');
                        text.setAttribute('align', 'center');
                        text.setAttribute('width', '5');
                        text.setAttribute('color', '#FFF');
                        text.setAttribute('font', 'mozillavr');
                        platEl.appendChild(text);

                        platContainer.appendChild(platEl);

                        let hHover = pDef.height + 0.762;
                        let dY = hHover - 0.85;
                        let trueR = Math.sqrt((this.radius * this.radius) - (dY * dY));
                        let pos = { x: trueR * dir.x, z: trueR * dir.z };
                        platEl.setAttribute('position', `${pos.x} 0 ${pos.z}`);

                        this.platforms.push({
                            el: platEl,
                            height: pDef.height,
                            radius: 0.75,
                            color: pDef.name,
                            hex: pDef.hex,
                            dir: dir,
                            pos: pos
                        });
                    }

                    let availableCrateDefs = COLOR_DEFS.slice(0, numPlatforms);
                    let shuffledPads = [...this.platforms].sort(() => 0.5 - Math.random());
                    let selectedPads = shuffledPads.slice(0, numCrates);

                    let validSetup = false;
                    let selectedCrateDefs = [];

                    while (!validSetup) {
                        let tempCrateDefs = [...availableCrateDefs].sort(() => 0.5 - Math.random()).slice(0, numCrates);
                        validSetup = true;
                        for (let i = 0; i < numCrates; i++) {
                            if (tempCrateDefs[i].name === selectedPads[i].color) {
                                validSetup = false;
                                break;
                            }
                        }
                        if (validSetup) {
                            selectedCrateDefs = tempCrateDefs;
                        }
                    }

                    this.startPad = this.platforms.find(p => !selectedPads.includes(p));
                    let unusedColorDef = availableCrateDefs.find(c => !selectedCrateDefs.includes(c));
                    this.finalLandingPad = this.platforms.find(p => p.color === unusedColorDef.name);

                    for (let i = 0; i < numCrates; i++) {
                        let cDef = selectedCrateDefs[i];
                        let pad = selectedPads[i];

                        let crateEl = document.createElement('a-entity');
                        crateEl.setAttribute('class', 'cargo-crate');
                        crateEl.setAttribute('data-color', cDef.name);

                        let box = document.createElement('a-box');
                        box.setAttribute('position', '0 0.2 0');
                        box.setAttribute('width', '0.4');
                        box.setAttribute('height', '0.4');
                        box.setAttribute('depth', '0.4');
                        box.setAttribute('material', 'src: #cassa-img');
                        box.setAttribute('texture-fallback', '');
                        crateEl.appendChild(box);

                        let topPlane = document.createElement('a-plane');
                        topPlane.setAttribute('position', '0 0.401 0');
                        topPlane.setAttribute('rotation', '-90 0 0');
                        topPlane.setAttribute('width', '0.4');
                        topPlane.setAttribute('height', '0.4');
                        topPlane.setAttribute('color', cDef.hex);
                        topPlane.setAttribute('material', 'shader: flat');
                        crateEl.appendChild(topPlane);

                        let cyl = document.createElement('a-cylinder');
                        cyl.setAttribute('position', '0 0.45 0');
                        cyl.setAttribute('radius', '0.01');
                        cyl.setAttribute('height', '0.1');
                        cyl.setAttribute('color', '#333');
                        crateEl.appendChild(cyl);

                        let magnet = document.createElement('a-sphere');
                        magnet.setAttribute('class', 'object-magnet');
                        magnet.setAttribute('position', '0 0.52 0');
                        magnet.setAttribute('radius', '0.046');
                        magnet.setAttribute('color', '#4CAF50');
                        magnet.setAttribute('material', 'emissive: #4CAF50');
                        crateEl.appendChild(magnet);

                        cratesContainer.appendChild(crateEl);
                        crateEl.object3D.position.set(pad.pos.x, pad.height, pad.pos.z);
                        crateEl.setAttribute('visible', 'true');
                    }

                    this.angle = Math.atan2(-this.startPad.dir.z, this.startPad.dir.x) * (180 / Math.PI);
                    this.heliY = this.startPad.height + 0.25;

                    this.timerStarted = false;
                    this.timerRunning = false;
                    this.elapsedTime = 0;
                    this.matchedCrates = 0;

                    if (this.statusTextEl) {
                        this.statusTextEl.setAttribute('value', `Crates: 0/${numCrates}\nTime: 00:00.0`);
                        this.statusTextEl.setAttribute('color', '#1976D2');
                    }
                };

                this.updateDioramaForLevel = () => {
                    let dioramaEl = document.querySelector('#diorama-env');
                    if (dioramaEl) {
                        dioramaEl.setAttribute('src', `scene${this.gameLevel}.glb`);
                    }
                };

                this.updateMenuUI = () => {
                    if (this.speedText) this.speedText.setAttribute('value', `${this.speedMultiplier.toFixed(0)} deg/s`);
                    if (this.windText) this.windText.setAttribute('value', `${this.wobbleAmplitude.toFixed(0)}`);
                    if (this.inertiaText) this.inertiaText.setAttribute('value', `${this.inertiaValue.toFixed(0)}`);
                    if (this.levelText) this.levelText.setAttribute('value', `Lv ${this.gameLevel}`);
                    if (this.versionText) this.versionText.setAttribute('value', `v${this.version}`);
                };

                let btnSpeedDec = document.querySelector('#btn-speed-dec');
                let btnSpeedInc = document.querySelector('#btn-speed-inc');
                let btnWindDec = document.querySelector('#btn-wind-dec');
                let btnWindInc = document.querySelector('#btn-wind-inc');
                let btnInertiaDec = document.querySelector('#btn-inertia-dec');
                let btnInertiaInc = document.querySelector('#btn-inertia-inc');
                let btnLevelDec = document.querySelector('#btn-level-dec');
                let btnLevelInc = document.querySelector('#btn-level-inc');

                if (btnSpeedDec) btnSpeedDec.addEventListener('click', () => { this.speedMultiplier = Math.max(10.0, this.speedMultiplier - 15.0); this.updateMenuUI(); });
                if (btnSpeedInc) btnSpeedInc.addEventListener('click', () => { this.speedMultiplier = Math.min(300.0, this.speedMultiplier + 15.0); this.updateMenuUI(); });
                if (btnWindDec) btnWindDec.addEventListener('click', () => { this.wobbleAmplitude = Math.max(0, this.wobbleAmplitude - 10); this.updateMenuUI(); });
                if (btnWindInc) btnWindInc.addEventListener('click', () => { this.wobbleAmplitude = Math.min(150, this.wobbleAmplitude + 10); this.updateMenuUI(); });
                if (btnInertiaDec) btnInertiaDec.addEventListener('click', () => { this.inertiaValue = Math.max(0, this.inertiaValue - 10); this.updateMenuUI(); });
                if (btnInertiaInc) btnInertiaInc.addEventListener('click', () => { this.inertiaValue = Math.min(100, this.inertiaValue + 10); this.updateMenuUI(); });
                
                if (btnLevelDec) btnLevelDec.addEventListener('click', () => { 
                    this.gameLevel = Math.max(1, this.gameLevel - 1); 
                    this.setupLevel(this.gameLevel); 
                    this.updateMenuUI(); 
                    this.updateDioramaForLevel(); 
                });
                if (btnLevelInc) btnLevelInc.addEventListener('click', () => { 
                    this.gameLevel = Math.min(3, this.gameLevel + 1); 
                    this.setupLevel(this.gameLevel); 
                    this.updateMenuUI(); 
                    this.updateDioramaForLevel(); 
                });

                this.setupLevel(this.gameLevel);
                this.updateMenuUI();
                this.updateDioramaForLevel();
            },

            tick: function (time, delta) {
                let dt = delta / 1000;
                let t = time / 1000; 
                
                let leftTrigger = 0, rightGrip = 0, rightStickY = 0, rightTrigger = 0;
                let xrSession = this.el.sceneEl.renderer?.xr?.getSession(); 
                
                if (xrSession && xrSession.inputSources) {
                    for (let source of xrSession.inputSources) {
                        if (source.handedness === 'left' && source.gamepad) {
                            let gp = source.gamepad;
                            leftTrigger = gp.buttons[0] ? gp.buttons[0].value : 0;
                        }
                        if (source.handedness === 'right' && source.gamepad) {
                            let gp = source.gamepad;
                            rightTrigger = gp.buttons[0] ? gp.buttons[0].value : 0; 
                            rightGrip = gp.buttons[1] ? (gp.buttons[1].value || (gp.buttons[1].pressed ? 1 : 0)) : 0;
                            rightStickY = gp.axes.length >= 4 ? gp.axes[3] : (gp.axes.length >= 2 ? gp.axes[1] : 0);
                        }
                    }
                }

                if (leftTrigger > 0.02 || rightTrigger > 0.02 || rightGrip > 0.02) this.initAudio();
                if (Math.abs(rightStickY) < 0.15) rightStickY = 0;
                if (leftTrigger < 0.02) leftTrigger = 0;

                let hudComp = this.hudDashboard ? this.hudDashboard.components['hud-drag'] : null;
                let isHudBeingDragged = hudComp && hudComp.isDragging;

                if (this.rightHandEl && this.rightHandEl.object3D && this.worldRoot && this.worldRoot.object3D && !isHudBeingDragged) {
                    let handObj = this.rightHandEl.object3D;
                    if (rightGrip > 0.5 && !this.isCockpitActive) {
                        handObj.updateMatrixWorld(true);
                        this.worldRoot.object3D.updateMatrixWorld(true);
                        if (!this.isDragging) {
                            this.isDragging = true;
                            this.initialControllerMatrixInv.copy(handObj.matrixWorld).invert();
                            this.initialWorldMatrix.copy(this.worldRoot.object3D.matrixWorld);
                        } else {
                            let currentControllerMatrix = handObj.matrixWorld;
                            let deltaMatrix = currentControllerMatrix.clone().multiply(this.initialControllerMatrixInv);
                            let targetMatrix = deltaMatrix.clone().multiply(this.initialWorldMatrix);

                            targetMatrix.decompose(this.dragP, this.dragQ, this.dragS);
                            this.dragEuler.setFromQuaternion(this.dragQ, 'YXZ');
                            this.dragQ.setFromEuler(this.dragEuler.set(0, this.dragEuler.y, 0, 'YXZ'));
                            this.worldRoot.object3D.position.copy(this.dragP);
                            this.worldRoot.object3D.quaternion.copy(this.dragQ);
                            this.worldRoot.object3D.updateMatrixWorld(true);
                        }
                    } else {
                        this.isDragging = false;
                    }
                }

                this.currentThrottle += (leftTrigger - this.currentThrottle) * dt * 5.0;
                this.currentStickY += (rightStickY - this.currentStickY) * dt * 6.0;

                let activeMinY = 0.25; 
                
                if (this.heliWrapperEl) {
                    this.heliWrapperEl.object3D.getWorldPosition(this.heliL);
                    this.worldRoot.object3D.worldToLocal(this.heliL);

                    for (let plat of this.platforms) {
                        let distHoriz = Math.hypot(this.heliL.x - plat.pos.x, this.heliL.z - plat.pos.z);
                        if (distHoriz < plat.radius) {
                            let surfaceY = plat.height + 0.25; 
                            if (this.heliY >= (surfaceY - 0.15)) {
                                activeMinY = Math.max(activeMinY, surfaceY);
                            }
                        }
                    }
                }

                let isAirborne = this.heliY > (activeMinY + 0.008);
                let wobbleThrottleOffset = 0;
                let wobbleStickOffset = 0;

                if (!this.timerStarted && (rightTrigger > 0.10 || leftTrigger > 0.10)) {
                    this.timerStarted = true;
                    this.timerRunning = true;
                }
                if (this.timerRunning) {
                    this.elapsedTime += dt;
                }

                if (this.wobbleAmplitude > 0 && isAirborne) {
                    let normWobble = this.wobbleAmplitude / 100.0;
                    wobbleThrottleOffset = ((Math.sin(t * 2.3) * 0.05) + (Math.cos(t * 4.7) * 0.025)) * normWobble;
                    wobbleStickOffset = ((Math.sin(t * 1.9) * 0.08) + (Math.cos(t * 3.8) * 0.04)) * normWobble;
                }

                let effectiveThrottleInput = Math.max(0, Math.min(1.0, this.currentThrottle + wobbleThrottleOffset));
                let effectiveStickYInput = Math.max(-1.0, Math.min(1.0, this.currentStickY + wobbleStickOffset));

                let takeoffThreshold = 0.35; 
                let effectiveThrottle = 0;
                let maxFlightHeight = 2.42;
                
                if (effectiveThrottleInput > takeoffThreshold) {
                    effectiveThrottle = (effectiveThrottleInput - takeoffThreshold) / (1.0 - takeoffThreshold);
                }

                let targetHeliY = activeMinY + (effectiveThrottle * (maxFlightHeight - (activeMinY - 0.25)));
                this.heliY += (targetHeliY - this.heliY) * dt * 6.0;
                if (this.heliY < activeMinY) this.heliY = activeMinY;

                let hingeAngleRad = Math.asin((this.heliY - 0.85) / this.radius);
                let hingeAngleDeg = hingeAngleRad * (180 / Math.PI);

                let speedFactor = effectiveStickYInput; 
                let pitchAngle = speedFactor * 15.0; 
                
                if (this.heliWrapperEl) this.heliWrapperEl.setAttribute('rotation', { x: 0, y: 0, z: -hingeAngleDeg });
                if (this.heliPitchEl) this.heliPitchEl.setAttribute('rotation', { x: 0, y: 0, z: pitchAngle });

                if (isAirborne) {
                    let targetSpeed = -speedFactor * effectiveThrottleInput * this.speedMultiplier;
                    if (this.inertiaValue <= 0) {
                        this.angularVelocity = targetSpeed;
                    } else {
                        let inertiaFactor = this.inertiaValue / 100.0;
                        let accelRate = 0.5 + ((1.0 - inertiaFactor) * 12.0); 
                        let friction = 0.3 + ((1.0 - inertiaFactor) * 8.0);   
                        let thrust = (targetSpeed - this.angularVelocity) * accelRate;
                        this.angularVelocity += thrust * dt;
                        if (Math.abs(targetSpeed) < 0.05) this.angularVelocity -= this.angularVelocity * friction * dt;
                    }
                } else {
                    if (this.inertiaValue <= 0) {
                        this.angularVelocity = 0;
                    } else {
                        let inertiaFactor = this.inertiaValue / 100.0;
                        let groundFriction = 2.5 + ((1.0 - inertiaFactor) * 8.0); 
                        this.angularVelocity -= this.angularVelocity * groundFriction * dt;
                        if (Math.abs(this.angularVelocity) < 0.2) this.angularVelocity = 0;
                    }
                }

                this.angle += this.angularVelocity * dt;
                this.currentAngularSpeed = Math.abs(this.angularVelocity);
                this.el.setAttribute('rotation', { x: 0, y: this.angle, z: hingeAngleDeg });

                if (this.currentThrottle > 0.01) {
                    this.rotorAngle += (effectiveThrottleInput * 4000) * dt;
                    if (this.rotorEl) this.rotorEl.setAttribute('rotation', `0 ${this.rotorAngle % 360} 0`);
                }

                let allCrates = Array.from(document.querySelectorAll('.cargo-crate'));

                if (this.hookMagnet && this.hookArea) {
                    this.hookMagnet.object3D.getWorldPosition(this.hookL);
                    this.worldRoot.object3D.worldToLocal(this.hookL);

                    let closestCrate = null;
                    let minDist = Infinity;

                    if (!this.attachedCrate) {
                        for(let crate of allCrates) {
                            if (crate.getAttribute('visible') === 'false' || crate.getAttribute('visible') === false) continue;
                            let objMagnet = crate.querySelector('.object-magnet');
                            objMagnet.object3D.getWorldPosition(this.objL);
                            this.worldRoot.object3D.worldToLocal(this.objL);
                            let dist = this.hookL.distanceTo(this.objL);
                            if (dist < minDist) {
                                minDist = dist;
                                closestCrate = crate;
                            }
                        }
                    } else {
                        closestCrate = this.attachedCrate;
                    }

                    let activeObjMagnet = closestCrate ? closestCrate.querySelector('.object-magnet') : null;
                    
                    let maxAllowedDist = 0.045; 
                    let canGrab = !this.attachedCrate && closestCrate && (minDist < maxAllowedDist); 
                    let canDrop = false;
                    let targetDropHeight = 0;

                    for (let plat of this.platforms) {
                        let distH = Math.hypot(this.hookL.x - plat.pos.x, this.hookL.z - plat.pos.z);
                        if (distH < plat.radius) {
                            if (this.hookL.y >= plat.height && this.hookL.y <= (plat.height + 0.8)) {
                                let isOccupied = allCrates.some(crate => {
                                    if (crate === this.attachedCrate) return false;
                                    let vis = crate.getAttribute('visible');
                                    if (vis === 'false' || vis === false) return false;
                                    let cx = crate.object3D.position.x;
                                    let cz = crate.object3D.position.z;
                                    let cy = crate.object3D.position.y;
                                    let distCrateToPlat = Math.hypot(cx - plat.pos.x, cz - plat.pos.z);
                                    return (distCrateToPlat < plat.radius && Math.abs(cy - plat.height) < 0.2);
                                });

                                if (!isOccupied) {
                                    canDrop = true;
                                    targetDropHeight = plat.height;
                                }
                                break;
                            }
                        }
                    }

                    allCrates.forEach(c => {
                        let mag = c.querySelector('.object-magnet');
                        if (mag && mag !== activeObjMagnet) {
                            mag.setAttribute('color', '#4CAF50');
                            mag.setAttribute('material', 'emissive', '#4CAF50');
                        }
                    });

                    let isYellow = (this.attachedCrate && canDrop) || (!this.attachedCrate && canGrab);

                    if (this.attachedCrate) {
                        if (canDrop) {
                            this.hookMagnet.setAttribute('color', '#FFFF00'); 
                            this.hookMagnet.setAttribute('material', 'emissive', '#FFFF00');
                            if (activeObjMagnet) {
                                activeObjMagnet.setAttribute('color', '#FFFF00');
                                activeObjMagnet.setAttribute('material', 'emissive', '#FFFF00');
                            }
                        } else {
                            this.hookMagnet.setAttribute('color', '#4CAF50'); 
                            this.hookMagnet.setAttribute('material', 'emissive', '#4CAF50');
                            if (activeObjMagnet) {
                                activeObjMagnet.setAttribute('color', '#4CAF50');
                                activeObjMagnet.setAttribute('material', 'emissive', '#4CAF50');
                            }
                        }
                    } else if (canGrab) {
                        this.hookMagnet.setAttribute('color', '#FFFF00'); 
                        this.hookMagnet.setAttribute('material', 'emissive', '#FFFF00');
                        if (activeObjMagnet) {
                            activeObjMagnet.setAttribute('color', '#FFFF00');
                            activeObjMagnet.setAttribute('material', 'emissive', '#FFFF00');
                        }
                    } else {
                        this.hookMagnet.setAttribute('color', '#4CAF50'); 
                        this.hookMagnet.setAttribute('material', 'emissive', '#4CAF50');
                        if (activeObjMagnet) {
                            activeObjMagnet.setAttribute('color', '#4CAF50');
                            activeObjMagnet.setAttribute('material', 'emissive', '#4CAF50');
                        }
                    }

                    if (isYellow && !this.prevIsYellow) {
                        this.triggerHaptics(0.7, 400);
                        this.playBeep(880, 0.4);
                    }
                    this.prevIsYellow = isYellow;

                    let triggerPressed = rightTrigger > 0.5;
                    if (triggerPressed && !this.prevRightTrigger) {
                        if (this.attachedCrate) {
                            if (canDrop) {
                                this.worldRoot.object3D.add(this.attachedCrate.object3D);
                                this.attachedCrate.object3D.position.set(this.hookL.x, targetDropHeight, this.hookL.z); 
                                this.attachedCrate.object3D.rotation.set(0, 0, 0);
                                this.attachedCrate = null;
                            }
                        } else if (canGrab) {
                            this.attachedCrate = closestCrate;
                            this.hookArea.object3D.add(this.attachedCrate.object3D);
                            this.attachedCrate.object3D.position.set(0, -0.762, 0); 
                            this.attachedCrate.object3D.rotation.set(0, 0, 0);
                        }
                    }
                    this.prevRightTrigger = triggerPressed;

                    allCrates.forEach(crate => {
                        if (crate === this.attachedCrate || crate.getAttribute('visible') === 'false' || crate.getAttribute('visible') === false) return;
                        
                        let targetFloorY = 0;
                        let cx = crate.object3D.position.x;
                        let cz = crate.object3D.position.z;
                        
                        for (let plat of this.platforms) {
                            if (Math.hypot(cx - plat.pos.x, cz - plat.pos.z) < plat.radius) {
                                targetFloorY = plat.height;
                                break;
                            }
                        }

                        let crateRestY = targetFloorY; 
                        if (crate.object3D.position.y > crateRestY) {
                            crate.object3D.position.y -= dt * 3.0; 
                            if (crate.object3D.position.y <= crateRestY) {
                                crate.object3D.position.y = crateRestY; 
                                crate.object3D.rotation.set(0, 0, 0);
                            }
                        }
                    });
                }

                let matched = 0;
                let numCrates = this.gameLevel + 1;
                allCrates.forEach(crate => {
                    if (crate.getAttribute('visible') === 'false' || crate.getAttribute('visible') === false) return;
                    if (crate === this.attachedCrate) return;
                    
                    let crateColor = crate.dataset.color;
                    let cx = crate.object3D.position.x;
                    let cz = crate.object3D.position.z;
                    let cy = crate.object3D.position.y;
                    
                    let matchingPlat = this.platforms.find(p => p.color === crateColor);
                    if (matchingPlat) {
                        let distH = Math.hypot(cx - matchingPlat.pos.x, cz - matchingPlat.pos.z);
                        if (distH < matchingPlat.radius && Math.abs(cy - matchingPlat.height) < 0.05) {
                            matched++;
                        }
                    }
                });
                this.matchedCrates = matched;

                if (this.matchedCrates === numCrates && this.timerRunning && !isAirborne) {
                    let distToTarget = Math.hypot(this.heliL.x - this.finalLandingPad.pos.x, this.heliL.z - this.finalLandingPad.pos.z);
                    if (distToTarget < this.finalLandingPad.radius) {
                        this.timerRunning = false;
                    }
                }

                if (this.statusTextEl) {
                    let m = Math.floor(this.elapsedTime / 60);
                    let s = Math.floor(this.elapsedTime % 60);
                    let ms = Math.floor((this.elapsedTime % 1) * 10);
                    let timeStr = `${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}.${ms}`;
                    
                    if (this.matchedCrates === numCrates && !this.timerRunning && this.timerStarted) {
                        this.statusTextEl.setAttribute('value', `Mission accomplished!\nTime: ${timeStr}`);
                        this.statusTextEl.setAttribute('color', '#388E3C');
                    } else {
                        this.statusTextEl.setAttribute('value', `Crates: ${this.matchedCrates}/${numCrates}\nTime: ${timeStr}`);
                        this.statusTextEl.setAttribute('color', '#1976D2');
                    }
                }

                if (this.audioInitialized && this.audioCtx) {
                    let targetFreq = 30 + (effectiveThrottleInput * 70);
                    let targetVolume = effectiveThrottleInput > 0.01 ? 0.18 : 0.0;
                    this.currentVol += (targetVolume - this.currentVol) * dt * 10.0;

                    let normRadialSpeed = Math.min(1.0, this.currentAngularSpeed / 250.0);
                    let targetWindOscFreq = 250 + (normRadialSpeed * 600);    
                    let targetFilterFreq = 400 + (normRadialSpeed * 2400);   
                    let targetWindVol = normRadialSpeed > 0.02 ? (normRadialSpeed * 0.38) : 0.0; 
                    this.currentWindVol += (targetWindVol - this.currentWindVol) * dt * 10.0;

                    this.oscillator.frequency.value = targetFreq;
                    this.gainNode.gain.value = this.currentVol;
                    this.windOsc.frequency.value = targetWindOscFreq;
                    this.windFilter.frequency.value = targetFilterFreq;
                    this.windGain.gain.value = this.currentWindVol;
                }
            }
        });
    </script>
    <style>
        #xr-button-container { position: fixed; bottom: 20px; right: 20px; z-index: 9999; display: flex; gap: 12px; }
        .custom-xr-btn { background-color: #2e7d32; color: white; border: 2px solid #4caf50; padding: 12px 24px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.3); transition: background 0.2s, transform 0.1s; }
        .custom-xr-btn:hover { background-color: #388e3c; transform: scale(1.05); }
    </style>
</head>
<body>
    <div id="xr-button-container">
        <button class="custom-xr-btn" onclick="document.querySelector('a-scene').enterAR()">AR</button>
        <button class="custom-xr-btn" onclick="document.querySelector('a-scene').enterVR()">VR</button>
    </div>

    <a-scene xr-mode-ui="enabled: false">
        <a-assets>
            <img id="terrain-img" src="terreno.jpg" crossorigin="anonymous">
            <img id="menu-bg" src="VertiVRMenu.jpg" crossorigin="anonymous">
            <img id="frontalino-img" src="frontalino.jpg" crossorigin="anonymous">
            <img id="cassa-img" src="cassa.jpg" crossorigin="anonymous">
            <a-asset-item id="verti-model" src="VertilowRed.glb"></a-asset-item>
        </a-assets>

        <a-light type="ambient" color="#FFF" intensity="1.2"></a-light>
        <a-light type="directional" color="#FFF" intensity="1.0" position="-1 3 1"></a-light>

        <!-- DIORAMA E MONDO DI GIOCO -->
        <a-entity id="world-root" position="0 0.9 -0.9" rotation="0 0 0" scale="0.06 0.06 0.06">
            
            <!-- DIORAMA 3D DINAMICO -->
            <a-gltf-model id="diorama-env" src="scene1.glb" scale="13 13 13" position="0 -0.5 -1.2"></a-gltf-model>

            <!-- STRUTTURA CENTRALE (TRONCO DI PIRAMIDE) -->
            <a-cone position="0 0.3 0" radius-bottom="1.524" radius-top="1.104" height="0.6" segments-radial="4" rotation="0 45 0" color="#E35815"></a-cone>
            
            <!-- FRONTALINO CENTRATO SULLA FACCIA ANTERIORE -->
            <a-plane position="0 0.3 0.932" rotation="-26.33 0 0" width="1.80" height="0.52" material="src: #frontalino-img; shader: flat; repeat: 1 1"></a-plane>
            
            <a-sphere position="0 0.6 0" radius="0.675" color="#FFCC00"></a-sphere>

            <!-- CONTENITORE DINAMICO PIATTAFORME -->
            <a-entity id="platforms-container"></a-entity>

            <!-- CONTENITORE DINAMICO CASSE -->
            <a-entity id="crates-container"></a-entity>

            <!-- VERTIBIRD -->
            <a-entity id="vertibird" position="0 0.85 0" vertibird-flight>
                <a-box id="rod" position="3.24 0 0" width="6.48" height="0.02" depth="0.02" color="#808080"></a-box>
                
                <a-entity id="heli-wrapper" position="6.48 0 0">
                    <a-entity id="heli-yaw" rotation="0 90 0">
                        <a-entity id="heli-pitch" rotation="0 0 0">
                            <a-gltf-model src="#verti-model" position="-0.10 0.2 0" scale="2.415 2.415 2.415" rotation="0 180 0"></a-gltf-model>

                            <a-entity position="-0.10 0.48 0">
                                <a-cylinder position="0 0.08 0" radius="0.035" height="0.15" material="color: #333"></a-cylinder>
                                <a-sphere position="0 0.16 0" radius="0.07" material="color: #FFCC00"></a-sphere>
                                <a-box id="main-rotor" position="0 0.19 0" width="2.8" height="0.012" depth="0.1" color="#FFEB3B"></a-box>
                            </a-entity>

                            <!-- GANCIO -->
                            <a-entity id="hook-area" position="0 0 0">
                                <a-cylinder position="0 -0.121 0" radius="0.003" height="0.242" color="#222"></a-cylinder>
                                <a-sphere id="hook-magnet" position="0 -0.242 0" radius="0.046" color="#4CAF50" material="emissive: #4CAF50"></a-sphere>
                            </a-entity>

                            <!-- CONTENITORE DELLA COCKPIT CAM -->
                            <a-entity id="cockpit-rig" position="0.95 -1.4 -0.95" rotation="0 150 0">
                                <a-camera id="cockpit-camera" position="0 0 0" rotation="0 0 0" active="false" wasd-controls-enabled="false" look-controls="enabled: false"></a-camera>
                            </a-entity>

                        </a-entity>
                    </a-entity>
                </a-entity>
            </a-entity>

        </a-entity>

        <!-- CONSOLLE MENU E HUD -->
        <a-entity id="central-dashboard" position="-1.2 1.2 -0.8" rotation="0 35 0" scale="0.25 0.25 0.25" hud-drag>
            <a-entity id="menu-panel" position="0 0 0" visible="true">
                <a-plane width="3.6" height="6.4" material="shader: flat; src: #menu-bg"></a-plane>

                <a-text value="Speed" position="-1.5 1.4 0.05" align="left" width="5.5" color="#000000"></a-text>
                <a-plane id="btn-speed-dec" class="clickable" position="-0.05 1.4 0.05" width="0.4" height="0.4" color="#D32F2F">
                    <a-text value="-" align="center" width="8" color="#FFF"></a-text>
                </a-plane>
                <a-text id="menu-speed-val" value="180 deg/s" position="0.6 1.4 0.05" align="center" width="4.5" color="#000000"></a-text>
                <a-plane id="btn-speed-inc" class="clickable" position="1.35 1.4 0.05" width="0.4" height="0.4" color="#388E3C">
                    <a-text value="+" align="center" width="8" color="#FFF"></a-text>
                </a-plane>

                <a-text value="Wobbling" position="-1.5 0.7 0.05" align="left" width="5.5" color="#000000"></a-text>
                <a-plane id="btn-wind-dec" class="clickable" position="-0.05 0.7 0.05" width="0.4" height="0.4" color="#D32F2F">
                    <a-text value="-" align="center" width="8" color="#FFF"></a-text>
                </a-plane>
                <a-text id="menu-wind-val" value="30" position="0.6 0.7 0.05" align="center" width="4.5" color="#000000"></a-text>
                <a-plane id="btn-wind-inc" class="clickable" position="1.35 0.7 0.05" width="0.4" height="0.4" color="#388E3C">
                    <a-text value="+" align="center" width="8" color="#FFF"></a-text>
                </a-plane>

                <a-text value="Inertia" position="-1.5 0.0 0.05" align="left" width="5.5" color="#000000"></a-text>
                <a-plane id="btn-inertia-dec" class="clickable" position="-0.05 0.0 0.05" width="0.4" height="0.4" color="#D32F2F">
                    <a-text value="-" align="center" width="8" color="#FFF"></a-text>
                </a-plane>
                <a-text id="menu-inertia-val" value="80" position="0.6 0.0 0.05" align="center" width="4.5" color="#000000"></a-text>
                <a-plane id="btn-inertia-inc" class="clickable" position="1.35 0.0 0.05" width="0.4" height="0.4" color="#388E3C">
                    <a-text value="+" align="center" width="8" color="#FFF"></a-text>
                </a-plane>

                <a-text value="Level" position="-1.5 -0.7 0.05" align="left" width="5.5" color="#000000"></a-text>
                <a-plane id="btn-level-dec" class="clickable" position="-0.05 -0.7 0.05" width="0.4" height="0.4" color="#D32F2F">
                    <a-text value="-" align="center" width="8" color="#FFF"></a-text>
                </a-plane>
                <a-text id="menu-level-val" value="Lv 1" position="0.6 -0.7 0.05" align="center" width="4.5" color="#000000"></a-text>
                <a-plane id="btn-level-inc" class="clickable" position="1.35 -0.7 0.05" width="0.4" height="0.4" color="#388E3C">
                    <a-text value="+" align="center" width="8" color="#FFF"></a-text>
                </a-plane>

                <!-- AREA HUD INTEGRATA PER STATO E TEMPO -->
                <a-plane position="0 -1.8 0.02" width="3.2" height="1.4" color="#FFFFFF" opacity="0.85" material="shader: flat"></a-plane>
                <a-text id="game-status-text" value="Crates: 0/2&#10;Time: 00:00.0" position="0 -1.8 0.05" align="center" width="6.5" color="#1976D2" font="mozillavr"></a-text>

                <a-text id="menu-version-val" value="v25.16.0" position="0 -2.8 0.05" align="center" width="3.2" color="#000000"></a-text>
            </a-entity>
        </a-entity>

        <!-- MAIN CAMERA -->
        <a-entity id="rig" position="0 0 0">
            <a-camera id="main-camera" position="0 1.5 0" active="true"></a-camera>
            <a-entity id="right-hand" oculus-touch-controls="hand: right" raycaster="objects: .clickable" laser-controls="hand: right"></a-entity>
            <a-entity id="left-hand" oculus-touch-controls="hand: left"></a-entity>
        </a-entity>
    </a-scene>
</body>
</html>
